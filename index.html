   scelte con il pulsante sole/luna (avvio.js imposta data-tema sulla radice della pagina).
   I nomi dei colori sono quelli nati con la sala notturna di ARGO: nella versione giorno
   «--notte» è semplicemente il colore di fondo della pagina e «--chiaro» il colore del testo. */
:root{
  color-scheme:dark;
  --display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --notte:#060b14; --notte2:#0a1322; --pannello:rgba(16,28,46,.78); --pannello-forte:rgba(22,38,62,.92); --pannello-pieno:#101c2e;
  --bordo:rgba(126,176,226,.16); --bordo-forte:rgba(126,176,226,.32);
  --chiaro:#eef3f9; --tenue:#b3c3d4; --spento:#7f90a5;
  --ambra:#f4a83c; --ambra-velo:rgba(244,168,60,.14); --turchese:#3fd8c8; --turchese-velo:rgba(63,216,200,.13);
  --rosso:#ff7a6e; --rosso-velo:rgba(255,122,110,.14); --blu:#6fb3ff; --blu-velo:rgba(111,179,255,.14);
  --su-accento:#06121a;            /* testo sopra un colore pieno */
  --titolo:#ffffff;                /* titoli: bianco pieno su fondo scuro */
  --velo:rgba(126,176,226,.07);    /* fondo leggero di campi e pulsanti */
  --fondo-barra:rgba(5,10,18,.86); --incavo:rgba(6,11,20,.6);   /* barre fisse e riquadri incassati */
  --ombra:0 18px 40px -24px rgba(0,0,0,.8);
  --alone-turchese:rgba(63,216,200,.10); --alone-ambra:rgba(244,168,60,.08); --griglia:rgba(126,176,226,.045);
  --r:10px;
}
:root[data-tema="giorno"]{
  color-scheme:light;
  --notte:#eef2f7; --notte2:#ffffff; --pannello:rgba(255,255,255,.92); --pannello-forte:#ffffff; --pannello-pieno:#ffffff;
  --bordo:rgba(20,45,80,.14); --bordo-forte:rgba(20,45,80,.32);
  --chiaro:#0d1b2e; --tenue:#3f5167; --spento:#66788d;
  --ambra:#a85d00; --ambra-velo:rgba(214,130,10,.14); --turchese:#08776c; --turchese-velo:rgba(8,119,108,.11);
  --rosso:#c2372b; --rosso-velo:rgba(194,55,43,.10); --blu:#1c64c4; --blu-velo:rgba(28,100,196,.10);
  --su-accento:#ffffff; --titolo:#0d1b2e;
  --velo:rgba(20,45,80,.05); --fondo-barra:rgba(255,255,255,.9); --incavo:rgba(20,45,80,.04);
  --ombra:0 14px 30px -22px rgba(20,45,80,.45);
  --alone-turchese:rgba(8,119,108,.08); --alone-ambra:rgba(214,130,10,.07); --griglia:rgba(20,45,80,.04);
}

/* Un riquadro che resta scuro anche di giorno (la mappa di ARGO: è uno schermo radar). */
:root[data-tema="giorno"] .sempre-notte{
  color-scheme:dark;color:var(--chiaro);
  --notte:#060b14; --notte2:#0a1322; --pannello:rgba(16,28,46,.78); --pannello-forte:rgba(22,38,62,.92); --pannello-pieno:#101c2e;
  --bordo:rgba(126,176,226,.16); --bordo-forte:rgba(126,176,226,.32);
  --chiaro:#eef3f9; --tenue:#b3c3d4; --spento:#7f90a5;
  --ambra:#f4a83c; --ambra-velo:rgba(244,168,60,.14); --turchese:#3fd8c8; --turchese-velo:rgba(63,216,200,.13);
  --rosso:#ff7a6e; --rosso-velo:rgba(255,122,110,.14); --blu:#6fb3ff; --blu-velo:rgba(111,179,255,.14);
  --su-accento:#06121a;            /* testo sopra un colore pieno */
  --titolo:#ffffff;                /* titoli: bianco pieno su fondo scuro */
  --velo:rgba(126,176,226,.07);    /* fondo leggero di campi e pulsanti */
  --fondo-barra:rgba(5,10,18,.86); --incavo:rgba(6,11,20,.6);   /* barre fisse e riquadri incassati */
  --ombra:0 18px 40px -24px rgba(0,0,0,.8);
  --alone-turchese:rgba(63,216,200,.10); --alone-ambra:rgba(244,168,60,.08); --griglia:rgba(126,176,226,.045);
}

/* l'attributo hidden vince sempre sugli stili di disposizione (es. etichette dei moduli) */
[hidden]{display:none!important}
</style>
<style id="css-inizio" media="not all">
/* Pagina iniziale della demo */
:root{color-scheme:dark;--font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--display:'Space Grotesk','Segoe UI',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;--notte:#0b1320;--carta:#f3efe6;--ambra:#e8a33d;--teal:#1f8a83}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--notte);color:var(--carta);font-family:var(--font)}
.inizio{max-width:880px;margin:0 auto;padding:48px 20px 40px}
.avviso{display:inline-block;background:#fde68a;color:#422006;font-weight:700;font-size:13px;border-radius:999px;padding:5px 12px;margin:0 0 28px}
.inizio h1{font-size:clamp(40px,8vw,76px);letter-spacing:.04em;margin:0;font-weight:800}
.inizio h1 span{color:var(--ambra)}
.claim{font-size:clamp(17px,2.4vw,21px);opacity:.85;max-width:620px;line-height:1.45;margin:14px 0 34px}
.scelte{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.scelta{display:flex;flex-direction:column;gap:8px;padding:22px;border-radius:18px;text-decoration:none;color:inherit;border:1px solid rgba(243,239,230,.18);transition:transform .15s,border-color .15s}
.scelta:hover,.scelta:focus-visible{transform:translateY(-2px);border-color:var(--ambra);outline:none}
.scelta b{font-size:26px;letter-spacing:.06em}
.scelta span{opacity:.8;line-height:1.4}
.scelta.argo{background:linear-gradient(160deg,#16243a,#0e1828)}
.scelta.iride{background:linear-gradient(160deg,#123b3a,#0c2626)}
.nota{margin-top:30px;font-size:14px;opacity:.75;line-height:1.5}
.nota button{margin-left:6px;background:none;border:1px solid rgba(243,239,230,.4);color:inherit;border-radius:999px;padding:4px 12px;font:inherit;cursor:pointer}

/* radar della pagina iniziale */
body{overflow-x:hidden}
.inizio{position:relative;z-index:1}
.inizio h1{font-family:var(--display);font-weight:700;letter-spacing:.14em}
.claim{font-family:var(--font)}
.avviso,.nota{font-family:var(--font)}
.scelta b{font-family:var(--display);letter-spacing:.14em}
.radar-sfondo{position:fixed;right:-18vmin;top:50%;width:96vmin;height:96vmin;transform:translateY(-50%);border-radius:50%;pointer-events:none;z-index:0;
  background:repeating-radial-gradient(circle,rgba(63,216,200,.10) 0 1px,transparent 1px 12vmin),
             conic-gradient(from 0deg,rgba(63,216,200,.32),rgba(63,216,200,0) 22%,transparent 100%);
  -webkit-mask:radial-gradient(circle,#000 62%,transparent 71%);mask:radial-gradient(circle,#000 62%,transparent 71%);animation:giro 10s linear infinite}
.radar-sfondo::after{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid rgba(63,216,200,.25)}
.punto{position:fixed;width:9px;height:9px;border-radius:50%;background:#e8a33d;box-shadow:0 0 14px #e8a33d;z-index:0;animation:lampo 3s ease-in-out infinite}
@keyframes giro{to{transform:translateY(-50%) rotate(360deg)}}
@keyframes lampo{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.radar-sfondo,.punto{animation:none}}
</style>
<style id="css-iride" media="not all">
/* IRIDE – app di accertamento (demo), sul telefono.
   Stessa famiglia grafica di ARGO: colori, caratteri e forme vengono da tema.css (notte e giorno).
   Qui c'è solo la disposizione delle schermate. Nessun colore scritto a mano, tranne l'avviso giallo della demo. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--chiaro);font:15px/1.45 var(--sans);
  background-color:var(--notte);
  background-image:radial-gradient(700px 420px at 85% -8%,var(--alone-turchese),transparent 62%),
                   radial-gradient(600px 420px at -10% 108%,var(--alone-ambra),transparent 58%);background-attachment:fixed}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blu)}
:focus-visible{outline:2px solid var(--turchese);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

/* ---- avviso della demo e barra in alto ---- */
.striscia{background:#fde68a;color:#3b2604;font:700 11.5px/1.3 var(--sans);text-align:center;padding:calc(4px + env(safe-area-inset-top)) 12px 4px}
.cima{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--pannello-forte);border-bottom:1px solid var(--bordo);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo b{font:700 19px/1 var(--display);letter-spacing:.2em}
.logo small{display:block;margin-top:3px;font:10px/1.2 var(--mono);color:var(--tenue);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radar{width:30px;height:30px;flex:none;color:var(--turchese)}
.radar .fascio{transform-origin:19px 19px;animation:iride-giro 4s linear infinite}
.radar .eco{fill:var(--ambra)}
@keyframes iride-giro{to{transform:rotate(360deg)}}
.rete{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--turchese);white-space:nowrap}
.rete i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:iride-vivo 2s infinite}
.rete.off{color:var(--rosso)}.rete.off i{animation:none}
@keyframes iride-vivo{0%{box-shadow:0 0 0 0 var(--turchese-velo)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.tondo{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--bordo-forte);background:var(--velo);display:grid;place-items:center;font:600 12px/1 var(--mono);letter-spacing:.04em;padding:0}
.tondo.on{background:var(--chiaro);color:var(--notte);border-color:transparent}
.menu{max-width:620px;margin:10px auto 0;padding:0 14px}
.menu .foglio{display:flex;flex-direction:column;gap:8px}
.menu .chi-sono b{display:block;font:600 16px/1.2 var(--display)}
.menu .chi-sono span{font-size:13px;color:var(--tenue)}

/* ---- pezzi comuni ---- */
.vista,.strumenti,.elenco{max-width:620px;margin:0 auto}
.vista{padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px}
.foglio{background:var(--pannello);border:1px solid var(--bordo);border-radius:14px;padding:14px;box-shadow:var(--ombra)}
h1{font:600 26px/1.12 var(--display);margin:8px 0 10px;text-wrap:balance;color:var(--chiaro);overflow-wrap:anywhere}
h3{font:700 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--tenue);margin:0 0 10px}
.kicker{font:600 11px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--turchese)}
.et{font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--spento)}
.sub,.todo{font-size:13px;color:var(--tenue);margin:0}
.az{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--bordo-forte);background:var(--velo);font-weight:600;text-decoration:none;color:var(--chiaro)}
.az.forte{background:var(--turchese);color:var(--su-accento);border-color:transparent}
.az.caldo{background:var(--ambra);color:var(--su-accento);border-color:transparent}
.azioni{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{width:100%;padding:11px 10px;border:1px solid var(--bordo-forte);border-radius:10px;background:var(--pannello-pieno);color:var(--chiaro);font-weight:600}
input[type=text],input[type=search],input:not([type]),input[type=date],input[type=time]{width:100%;padding:11px 12px;border:1px solid var(--bordo-forte);border-radius:10px;background:var(--pannello-pieno);color:var(--chiaro);font-size:16px}
input::placeholder{color:var(--spento)}
.link{border:0;background:none;color:var(--blu);font-weight:600;padding:0;text-decoration:underline}
.empty{text-align:center;color:var(--tenue);padding:36px 10px;margin:0}

/* ---- Missione (riepilogo) ---- */
.stato{display:inline-flex;align-items:center;gap:7px;font:600 12.5px/1.3 var(--sans);border-radius:999px;padding:5px 11px}
.stato .ic{width:15px;height:15px}
.stato.ok{color:var(--turchese);background:var(--turchese-velo)}
.stato.prep{color:var(--ambra);background:var(--ambra-velo)}
.avanzamento{display:flex;align-items:center;gap:16px;margin-top:16px}
.anello{width:108px;height:108px;flex:none}
.anello circle{fill:none;stroke-width:9}
.anello .base{stroke:var(--bordo-forte)}
.anello .fatto{stroke:var(--turchese);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.7,.2,1)}
.anello .n{font:600 26px var(--display);fill:var(--chiaro)}
.anello .d{font:600 9.5px var(--mono);letter-spacing:.12em;fill:var(--tenue)}
.conteggi{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;min-width:0}
.conteggi div{display:flex;flex-direction:column;gap:3px;padding-left:9px;border-left:3px solid var(--bordo-forte)}
.conteggi b{font:600 21px/1 var(--display)}
.conteggi span{font-size:11.5px;color:var(--tenue);line-height:1.2}
.conteggi .cA{border-color:var(--turchese)}.conteggi .cX{border-color:var(--ambra)}.conteggi .cN{border-color:var(--rosso)}.conteggi .cL{border-color:var(--blu)}
.etichette{display:flex;flex-wrap:wrap;gap:6px}
.etichetta{border:1px solid var(--bordo-forte);border-radius:999px;padding:4px 10px;font-size:13px}
.etichetta.luogo{border-color:transparent;background:var(--velo);color:var(--tenue)}
.prossimi{display:flex;flex-direction:column;gap:6px}
.prossimi .riga{box-shadow:none}
.foglio>.az{width:100%;margin-top:10px}
.hbtn{display:flex;gap:6px}

/* ---- Locali ed Esiti: strumenti in alto ---- */
.strumenti{padding:12px 14px 4px;display:flex;flex-direction:column;gap:10px}
.titolo-vista{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.titolo-vista h1{margin:4px 0 0;font-size:22px}
.titolo-vista .az{min-height:38px;padding:7px 11px;font-size:13px}
.liste{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--velo);border:1px solid var(--bordo);border-radius:12px;padding:3px}
.liste button{border:0;background:none;border-radius:9px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 13px/1 var(--sans);color:var(--tenue)}
.liste small{font:10px/1 var(--mono);color:var(--spento)}
.liste button.on{background:var(--pannello-pieno);color:var(--chiaro);box-shadow:inset 0 -2px 0 var(--turchese)}
.cerca{display:flex;gap:8px}
.campo{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:1px solid var(--bordo-forte);border-radius:12px;background:var(--pannello);padding:0 12px;color:var(--spento)}
.campo input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px;color:var(--chiaro);outline:0;border-radius:0}
#filtri{display:flex;align-items:center;gap:6px;border:1px solid var(--bordo-forte);border-radius:12px;background:var(--pannello);padding:0 12px;font-weight:600}
#filtri b{font:600 11px/1 var(--mono);background:var(--ambra);color:var(--su-accento);border-radius:999px;padding:3px 6px}
#filtri.on{border-color:var(--turchese);color:var(--turchese)}
.filtri{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--bordo-forte);background:none;border-radius:999px;padding:7px 13px;font:600 13px/1.2 var(--sans);color:var(--tenue)}
.chips button.on{background:var(--chiaro);color:var(--notte);border-color:transparent}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:3px;background:var(--velo);border:1px solid var(--bordo);border-radius:12px;padding:3px}
.seg button{flex:1;min-width:0;border:0;background:none;border-radius:9px;padding:7px 2px;font:600 11.5px/1.2 var(--sans);color:var(--tenue);display:flex;flex-direction:column;align-items:center;gap:3px}
.seg button b{font:600 16px/1 var(--display);color:var(--chiaro)}
.seg button.on{background:var(--pannello-pieno);color:var(--chiaro);box-shadow:inset 0 -2px 0 var(--turchese)}
.seg .zA b{color:var(--turchese)}.seg .zX b{color:var(--ambra)}.seg .zN b{color:var(--rosso)}.seg .zL b{color:var(--blu)}
.found{font-size:12.5px;color:var(--spento)}

/* ---- elenco: righe compatte che si aprono sul posto ---- */
.elenco{padding:6px 14px 150px;display:flex;flex-direction:column;gap:8px}
.riga{background:var(--pannello);border:1px solid var(--bordo);border-left:4px solid var(--bordo-forte);border-radius:14px;overflow:hidden;transition:transform .28s,opacity .28s}
.riga{scroll-margin:76px 0 100px}
.riga.aperta{border-color:var(--bordo-forte);box-shadow:var(--ombra)}
.riga.isA{border-left-color:var(--turchese)}.riga.isL{border-left-color:var(--blu)}.riga.isX{border-left-color:var(--ambra)}.riga.isN{border-left-color:var(--rosso)}
.riga.leaving{transform:translateX(110%);opacity:0}
.testa{width:100%;display:flex;align-items:center;gap:11px;border:0;background:none;text-align:left;padding:11px 12px 11px 10px}
.chi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chi b{font:600 16px/1.25 var(--display);overflow-wrap:anywhere}
.chi small{font-size:12px;line-height:1.3;color:var(--tenue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chi small.via{color:var(--spento)}
.pr{flex:none;width:50px;text-align:center;font:600 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:6px 0;border:1px solid var(--bordo-forte);color:var(--tenue)}
.pr.hot{background:var(--ambra);color:var(--su-accento);border-color:transparent}
.pr.cold{color:var(--spento);border-color:var(--bordo)}
.segno{flex:none;display:flex;align-items:center;gap:6px;color:var(--spento)}
.segno .giu{transition:transform .2s}.aperta .segno .giu{transform:rotate(180deg)}
.segno .avv{color:var(--rosso);width:17px;height:17px}
.pill{font:600 10.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:5px 8px;white-space:nowrap}
.pill.eA{background:var(--turchese-velo);color:var(--turchese)}.pill.eL{background:var(--blu-velo);color:var(--blu)}
.pill.eX{background:var(--ambra-velo);color:var(--ambra)}.pill.eN{background:var(--rosso-velo);color:var(--rosso)}
.corpo{padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--bordo)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bordo-forte);color:var(--tenue);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600}
.badge .ic{width:14px;height:14px}
.badge.cr{color:var(--rosso);background:var(--rosso-velo);border-color:transparent}
.badge.nuovo{color:var(--blu);background:var(--blu-velo);border-color:transparent}
.badge.tE,.badge.tM{color:var(--chiaro)}
.naviga{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--chiaro);border:1px solid var(--bordo-forte);border-radius:12px;padding:10px 12px;background:var(--velo)}
.naviga .dove{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.naviga b{display:inline-flex;align-items:center;gap:5px;color:var(--turchese);font-size:13px;white-space:nowrap}
.naviga b .ic{width:16px;height:16px}
.ev{background:var(--ambra-velo);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4}
.time{display:flex;align-items:center;gap:6px;font:600 14.5px var(--mono);margin-bottom:3px}.time .ic{width:16px;height:16px}
.price{margin-top:4px;font-weight:600}

@keyframes giro{to{transform:rotate(360deg)}}
.voci{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.voci button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;color:var(--tenue);text-align:left;padding:9px 12px;border-radius:8px;cursor:pointer;transition:background .15s,color .15s}
.voci button:hover{background:rgba(126,176,226,.07);color:var(--chiaro)}
.voci button.on{background:linear-gradient(90deg,rgba(63,216,200,.16),rgba(63,216,200,.02));color:var(--chiaro);box-shadow:inset 2px 0 0 var(--turchese)}
.voci .conta{font:700 11px/1 var(--mono);background:var(--ambra);color:#1b1206;border-radius:999px;padding:4px 7px;box-shadow:0 0 12px rgba(244,168,60,.45)}
.voci .sep{font:10px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--spento);padding:16px 12px 6px}
.rail-piede{margin-top:auto;padding:14px 16px 18px;border-top:1px solid var(--bordo);font-size:12px;color:var(--tenue);display:flex;flex-direction:column;gap:8px}
.rail-link,.rail-piede button{color:var(--chiaro);text-decoration:none;background:rgba(126,176,226,.06);border:1px solid var(--bordo);border-radius:8px;padding:7px 10px;text-align:center;cursor:pointer;font-size:12.5px}
.rail-link:hover,.rail-piede button:hover{border-color:var(--turchese)}

.testata{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:12px 32px;border-bottom:1px solid var(--bordo);background:var(--fondo-barra);backdrop-filter:blur(10px);position:sticky;top:env(safe-area-inset-top,0px);z-index:4}
.demo{background:#fde68a;color:#3b2604;font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px}
.perimetro{font:12.5px var(--mono);color:var(--tenue)}
.perimetro b{color:var(--turchese);font-weight:700}
.chi{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tenue)}
.chi select{border:1px solid var(--bordo-forte);background:var(--notte2);color:var(--chiaro);border-radius:8px;padding:6px 8px}
.corpo{padding:26px 32px 80px;max-width:1320px}

/* ---- tipografia ---- */
.occhiello{font:700 11px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--turchese)}
h1.titolo{font:600 38px/1.05 var(--display);letter-spacing:.01em;margin:8px 0 6px;text-wrap:balance;color:var(--titolo)}
.sottotitolo{color:var(--tenue);max-width:780px;margin:0 0 22px}
h2{font:600 20px/1.2 var(--display);letter-spacing:.02em;margin:0 0 6px;color:var(--titolo)}
h3{font:700 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--chiaro);margin:0 0 12px}

/* ---- pannelli ---- */
.foglio{background:var(--pannello);border:1px solid var(--bordo);border-radius:var(--r);padding:18px 20px;overflow-x:auto;min-width:0;backdrop-filter:blur(6px);box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 18px 40px -24px rgba(0,0,0,.8)}
.foglio table.reg{min-width:560px}
.griglia{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.riga{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spazio{height:18px}

/* contatori «cosa aspetta» */
.attese{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.attesa{position:relative;padding:14px 16px 13px;cursor:pointer;text-align:left;background:var(--pannello);border:1px solid var(--bordo);border-radius:var(--r);color:var(--tenue);transition:border-color .15s,transform .15s}
.attesa:hover{border-color:var(--bordo-forte);transform:translateY(-1px)}
.attesa b{display:block;font:600 34px/1 var(--display);color:var(--chiaro);margin-bottom:4px}
.attesa span{font-size:12.5px}
.attesa.calda{border-color:rgba(244,168,60,.45);box-shadow:0 0 0 1px rgba(244,168,60,.12) inset,0 0 24px -10px rgba(244,168,60,.6)}
.attesa.calda b{color:var(--ambra)}
.attesa.calda::after{content:'';position:absolute;top:12px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--ambra);box-shadow:0 0 10px var(--ambra)}

/* tabelle */
table.reg{width:100%;border-collapse:collapse;font-size:14px}
table.reg th{font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--spento);text-align:left;padding:10px;border-bottom:1px solid var(--bordo-forte)}
table.reg td{padding:10px;border-bottom:1px solid var(--bordo);vertical-align:top}
table.reg td small{color:var(--tenue)}
table.reg tr.sel td{background:var(--ambra-velo)}
table.reg tr.clic{cursor:pointer}
table.reg tr.clic:hover td{background:rgba(126,176,226,.06)}
td.n,th.n{text-align:right}
.barra{height:6px;background:rgba(126,176,226,.12);border-radius:3px;overflow:hidden;min-width:120px}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--turchese),#7ff0e4)}
.barra.bassa i{background:linear-gradient(90deg,var(--ambra),#ffd18a)}

/* etichette di stato: una luce + testo */
.et{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--sans);border-radius:999px;padding:4px 9px 4px 8px;white-space:nowrap;background:rgba(126,176,226,.08);color:var(--tenue);border:1px solid var(--bordo)}
.et::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.et.ambra{background:var(--ambra-velo);color:var(--ambra);border-color:rgba(244,168,60,.3)}
.et.salvia{background:var(--turchese-velo);color:var(--turchese);border-color:rgba(63,216,200,.3)}
.et.mattone{background:var(--rosso-velo);color:var(--rosso);border-color:rgba(255,122,110,.3)}
.et.mare{background:var(--blu-velo);color:var(--blu);border-color:rgba(111,179,255,.3)}
.et.scuro{background:var(--chiaro);color:var(--notte);border-color:var(--chiaro)}

/* pulsanti */
.btn{border:1px solid var(--bordo-forte);background:rgba(126,176,226,.1);color:var(--chiaro);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover{border-color:var(--turchese)}
.btn.ambra{background:linear-gradient(180deg,#f8b955,#e9951f);border-color:#f4a83c;color:#1b1206;box-shadow:0 6px 18px -8px rgba(244,168,60,.7)}
.btn.ambra:hover{box-shadow:0 8px 24px -8px rgba(244,168,60,.9)}
.btn.chiaro{background:transparent}
.btn.piccolo{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none}
.perche{display:block;font-size:12px;color:var(--spento);margin-top:4px}
.azione{display:inline-flex;flex-direction:column;align-items:flex-start}

/* moduli */
.campo{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--tenue);margin-bottom:12px}
.campo input,.campo select,.campo textarea{border:1px solid var(--bordo-forte);background:var(--notte2);border-radius:8px;padding:9px 10px;font-weight:400;color:var(--chiaro)}
.campo textarea{min-height:64px;resize:vertical}
.scelte-lista{max-height:320px;overflow:auto;border:1px solid var(--bordo);border-radius:8px;background:var(--incavo)}
.scelte-lista label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--bordo);font-size:14px;cursor:pointer}
.scelte-lista label:hover{background:rgba(126,176,226,.05)}
.scelte-lista label small{display:block;color:var(--spento)}
.opzione{border:1px solid var(--bordo-forte);border-radius:8px;padding:12px 14px;background:var(--incavo);cursor:pointer}

/* timeline della missione */
.linea-tempo{display:grid;grid-template-columns:repeat(8,1fr);margin:16px 0 4px}
.tappa{position:relative;padding:22px 8px 0 0;font-size:12px;color:var(--spento);border-top:2px solid var(--bordo-forte)}
.tappa::before{content:'';position:absolute;top:-7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--notte);border:2px solid var(--bordo-forte)}
.tappa b{display:block;color:var(--tenue);font-size:12.5px;font-weight:600}
.tappa.fatta{border-top-color:var(--turchese)}.tappa.fatta::before{background:var(--turchese);border-color:var(--turchese);box-shadow:0 0 10px var(--turchese)}
.tappa.fatta b{color:var(--chiaro)}
.tappa.ritardo{border-top-color:var(--ambra);color:var(--ambra)}.tappa.ritardo::before{border-color:var(--ambra);box-shadow:0 0 10px rgba(244,168,60,.6)}

/* Scheda Missione: documento chiaro dentro la sala */
.scheda{background:#f6f2ea;color:#16202d;border-radius:var(--r);padding:22px 26px;max-width:900px;box-shadow:0 24px 50px -28px rgba(0,0,0,.9)}
.scheda header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #16202d;padding-bottom:10px;margin-bottom:14px}
.scheda h2{color:#16202d}
.scheda .occhiello{color:#8a5a12}
.scheda dl{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;margin:0 0 14px;font-size:14px}
.scheda dt{color:#6b7280;font:700 10.5px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.1em}
.scheda dd{margin:0}
.scheda table.reg th{color:#6b7280;border-bottom-color:#c9c1b0}
.scheda table.reg td{border-bottom-color:#e2dccf}
.scheda table.reg td small,.scheda .perche{color:#6b7280}
.scheda .et{background:#ece6d8;color:#4b5565;border-color:transparent}
.scheda .et.ambra{background:#f6e2c2;color:#7a4209}.scheda .et.salvia{background:#d6ece6;color:#1f5f52}
.dati{display:grid;grid-template-columns:160px 1fr;gap:7px 14px;margin:0;font-size:14px}
.dati dt{color:var(--spento);font:700 10.5px/1.7 var(--mono);text-transform:uppercase;letter-spacing:.1em}
.dati dd{margin:0}

a.maps{font:600 11px var(--mono);color:var(--turchese);text-decoration:none;border:1px solid rgba(63,216,200,.3);border-radius:999px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.scheda a.maps{color:#1f5f52;border-color:#9cc9bd}

/* avvisi */
.avviso{border:1px solid rgba(244,168,60,.35);background:var(--ambra-velo);padding:11px 14px;border-radius:8px;font-size:14px;margin:0 0 16px}
.avviso.info{border-color:rgba(111,179,255,.35);background:var(--blu-velo)}
.avviso.ok{border-color:rgba(63,216,200,.35);background:var(--turchese-velo)}
.avviso.no{border-color:rgba(255,122,110,.4);background:var(--rosso-velo)}
.vuoto{color:var(--spento);font-style:italic;padding:14px 0}
.ricerche{font:13px var(--mono);background:var(--incavo);border:1px dashed var(--bordo-forte);border-radius:8px;padding:10px 12px;margin:8px 0}
.ricerche div{padding:2px 0;color:var(--turchese)}

/* indicatori */
.kpi{display:grid;grid-template-columns:1fr auto auto minmax(150px,auto);gap:4px 22px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--bordo)}
.kpi .v{font:600 26px/1 var(--display)}
.kpi div:nth-child(3) .v{color:var(--turchese)}
.kpi .p{color:var(--spento);font:11px var(--mono);text-transform:uppercase;letter-spacing:.1em}
.kpi .nome{font-weight:600}
.kpi .nome small{display:block;font-weight:400;color:var(--tenue);font-size:12.5px}

/* ---- effetti della sala ---- */
.orologio{display:inline-flex;align-items:center;gap:8px;font:600 11.5px var(--mono);letter-spacing:.12em;color:var(--turchese)}
.orologio i{width:8px;height:8px;border-radius:50%;background:var(--turchese);box-shadow:0 0 0 0 rgba(63,216,200,.7);animation:vivo 2s infinite}
@keyframes vivo{0%{box-shadow:0 0 0 0 rgba(63,216,200,.6)}70%{box-shadow:0 0 0 9px rgba(63,216,200,0)}100%{box-shadow:0 0 0 0 rgba(63,216,200,0)}}
.entrata .attesa,.entrata .sala>*,.entrata h1.titolo,.entrata .sottotitolo{animation:entra .6s cubic-bezier(.2,.7,.2,1) both}
.entrata h1.titolo{animation-delay:.05s}.entrata .sottotitolo{animation-delay:.12s}
.entrata .attesa:nth-child(1){animation-delay:.18s}.entrata .attesa:nth-child(2){animation-delay:.24s}.entrata .attesa:nth-child(3){animation-delay:.3s}
.entrata .attesa:nth-child(4){animation-delay:.36s}.entrata .attesa:nth-child(5){animation-delay:.42s}.entrata .attesa:nth-child(6){animation-delay:.48s}
.entrata .sala>*:nth-child(1){animation-delay:.45s}.entrata .sala>*:nth-child(2){animation-delay:.6s}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.mappa .cella:hover{filter:brightness(1.45) drop-shadow(0 0 10px rgba(63,216,200,.55))}
.mappa .cella.sel{animation:alone 2.2s ease-in-out infinite}
@keyframes alone{50%{filter:brightness(1.35) drop-shadow(0 0 14px rgba(231,238,246,.55))}}
.mappa-box{background:radial-gradient(600px 340px at 50% 45%,rgba(63,216,200,.07),transparent 70%),var(--pannello)}

/* ---- mappa del territorio ---- */
.sala{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(300px,1fr);gap:18px;margin-bottom:18px}
.mappa-box{position:relative;padding:14px 14px 10px;overflow:hidden}
.mappa-testa{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.livelli{display:flex;flex-wrap:wrap;gap:6px}
.livelli button{border:1px solid var(--bordo);background:transparent;color:var(--spento);border-radius:999px;padding:4px 10px;font:600 12px var(--sans);cursor:pointer}
.livelli button.on{color:var(--chiaro);border-color:var(--bordo-forte);background:rgba(126,176,226,.1)}
.livelli button i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
svg.mappa{width:100%;height:auto;display:block}
.mappa .cella{stroke:rgba(160,200,240,.35);stroke-width:1.2;cursor:pointer;transition:filter .15s,opacity .15s}

.mappa .cella.sel{stroke:var(--chiaro);stroke-width:2.5}
.mappa .cella.fuori{opacity:.28;cursor:not-allowed}
.mappa .confine{fill:none;stroke:rgba(231,238,246,.55);stroke-width:2.2;stroke-dasharray:6 5;pointer-events:none}
.mappa text{pointer-events:none;fill:var(--chiaro)}
.mappa .nome-comune{font:600 26px var(--display);letter-spacing:.05em;paint-order:stroke;stroke:rgba(6,11,20,.85);stroke-width:6px}
.mappa .valore{font:18px var(--mono);fill:var(--tenue);paint-order:stroke;stroke:rgba(6,11,20,.85);stroke-width:5px}
.mappa .nome-district{font:15px var(--mono);letter-spacing:.24em;fill:rgba(231,238,246,.45)}
.mappa .pin{pointer-events:none}
.mappa .onda{fill:none;stroke:var(--ambra);stroke-width:2;animation:onda 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes onda{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.2)}}
.legenda{display:flex;align-items:center;gap:10px;font:11px var(--mono);color:var(--spento);margin-top:6px}
.legenda .scala{flex:0 0 140px;height:8px;border-radius:4px;background:linear-gradient(90deg,#f4a83c,#7d8c6a,#3fd8c8)}
.suggerimento{position:absolute;pointer-events:none;z-index:5;min-width:200px;background:var(--pannello-forte);border:1px solid var(--bordo-forte);border-radius:8px;padding:10px 12px;font-size:13px;box-shadow:0 12px 30px -10px rgba(0,0,0,.8);opacity:0;transition:opacity .1s}
.suggerimento.on{opacity:1}
.suggerimento b{font:600 15px var(--display);letter-spacing:.04em}
.suggerimento dl{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin:6px 0 0;font-size:12.5px}
.suggerimento dt{color:var(--tenue)}.suggerimento dd{margin:0;text-align:right;font-family:var(--mono)}
.pannello-comune h2{font-size:26px}
.cifre{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 14px}
.cifra{border:1px solid var(--bordo);border-radius:8px;padding:10px;background:var(--incavo)}
.cifra b{display:block;font:600 24px/1 var(--display)}
.cifra span{font-size:11.5px;color:var(--tenue)}
.cifra.calda b{color:var(--ambra)}.cifra.fresca b{color:var(--turchese)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--pannello-forte);border:1px solid var(--bordo-forte);color:var(--chiaro);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.22s;pointer-events:none;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modale{position:fixed;inset:0;background:rgba(2,6,12,.7);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.modale .foglio{width:min(760px,100%);background:var(--pannello-forte)}

@media (max-width:1050px){.sala{grid-template-columns:1fr}}
@media (max-width:900px){
  .corpo,.testata{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .linea-tempo{grid-template-columns:repeat(4,1fr);row-gap:14px}
  .g2{grid-template-columns:1fr}
  h1.titolo{font-size:30px}
  .kpi{grid-template-columns:1fr auto auto}
  .kpi div:last-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tema{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--bordo-forte);background:var(--velo);color:var(--chiaro);cursor:pointer;padding:0}
.tema svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- ARGO sul telefono: si consulta, non è il posto principale di lavoro ----
   Sotto i 900px: il menu laterale diventa un pannello a tutto schermo (voce «Altro»),
   le quattro sezioni più usate stanno in una barra in basso come in IRIDE,
   e sotto i 700px le tabelle diventano schede (le etichette le mette argo.js). */
.barra-basso,.chiudi-menu,.marchio-mini,.passa-iride{display:none}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:900px){
  .argo{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0;z-index:30;height:auto;background:var(--notte);display:none;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .menu-aperto .rail{display:flex}
  .voci{flex-direction:column;flex-wrap:nowrap}
  .voci .sep{display:block}
  .voci button{padding:13px 12px;font-size:16px}
  .chiudi-menu{display:block;margin:12px 12px 0;padding:11px;border:1px solid var(--bordo-forte);border-radius:10px;background:var(--velo);color:var(--chiaro);font-weight:600}
  .testata{position:static;padding-top:10px;padding-bottom:10px;gap:8px 10px;justify-content:flex-start}
  .marchio-mini{display:inline;font:700 17px/1 var(--display);letter-spacing:.2em;margin-right:auto}
  .passa-iride{display:inline-flex;align-items:center;min-height:36px;padding:0 13px;border:0;border-radius:999px;background:var(--turchese);color:var(--su-accento);font-weight:700;font-size:13px;cursor:pointer}
  .orologio{display:none}
  .perimetro{order:5;flex:1 1 100%;font-size:12.5px}
  .chi{order:4;flex:1 1 100%;display:flex;align-items:center;gap:8px}.chi select{flex:1;min-width:0;padding:10px 8px}
  .corpo{padding-top:18px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
  .foglio{padding:14px}
  .barra-basso{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;position:fixed;left:0;right:0;bottom:0;z-index:31;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--pannello-forte);border-top:1px solid var(--bordo);backdrop-filter:blur(12px)}
  .barra-basso button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:12px;color:var(--spento);font:600 10.5px/1 var(--sans);cursor:pointer;min-width:0}
  .barra-basso button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barra-basso button.on{color:var(--turchese);background:var(--turchese-velo)}
  .barra-basso .conta{position:absolute;top:2px;left:calc(50% + 6px);font:700 10px/1 var(--mono);background:var(--ambra);color:var(--su-accento);border-radius:999px;padding:3px 5px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px)}
  .modale{padding:14px 10px calc(96px + env(safe-area-inset-bottom,0px))}
  .btn{min-height:42px}
  .mappa-testa{flex-direction:column;align-items:flex-start;gap:8px}
}
@media (max-width:700px){
  .linea-tempo{grid-template-columns:repeat(2,1fr)}
  .attese{grid-template-columns:1fr 1fr}
  table.reg.schede,table.reg.schede tbody{display:block;min-width:0!important}
  table.reg.schede tr.intestazione{display:none}
  table.reg.schede tr{display:block;border:1px solid var(--bordo);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:var(--velo)}
  table.reg.schede td{display:block;position:relative;padding:5px 0;border:0;overflow-wrap:anywhere}
  table.reg.schede td:empty{display:none}
  table.reg.schede td[data-et]{padding-left:40%;min-height:27px}
  table.reg.schede td[data-et]::before{content:attr(data-et);position:absolute;left:0;top:7px;width:37%;font:700 9.5px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--spento);overflow-wrap:anywhere}
  table.reg.schede tr.sel{border-color:var(--ambra);background:var(--ambra-velo)}
  .scheda{padding:16px 14px}
  .scheda table.reg.schede tr{background:none;border-color:#c9c1b0}
  .scheda table.reg.schede td[data-et]::before{color:#6b7280}
}

<script>/* regole.js */
/*
 * ARGO / IRIDE – REGOLE DELLA DEMO
 *
 * Tutte le regole della demo stanno qui, scritte una volta sola come funzioni
 * senza interfaccia: permessi, stati, anticipo, correzioni, incrocio delle
 * segnalazioni, priorità, caricamenti, indicatori.
 *
 * ATTENZIONE: nella demo queste regole girano nel browser e sono SIMULATE.
 * Nel sistema definitivo vanno verificate dal server (docs/permessi.md).
 *
 * Riferimenti: docs/permessi.md, docs/dati.md, docs/flussi.md, DECISIONI.md.
 * Test: demo/test/regole.test.js  (eseguire con: node --test demo/test)
 */
(function (radice) {
  'use strict';

  var ORA_MS = 3600 * 1000;
  var GIORNO_MS = 24 * ORA_MS;

  // ------------------------------------------------------------ persone
  // Una persona ha quattro impostazioni indipendenti (docs/permessi.md §1):
  //   funzione:    'area' | 'district' | 'presidio' | null
  //   argo:        'nessuno' | 'lettura' | 'completo'
  //   perimetro:   { tipo: 'area' }  oppure  { tipo: 'district', id: 'D1' }
  //   accertamenti: true | false
  // più admin: true per l'amministratore.

  function isArea(p) { return p.funzione === 'area'; }
  function isDistrict(p) { return p.funzione === 'district'; }
  function isPresidio(p) { return p.funzione === 'presidio'; }
  function districtDi(p) { return p.perimetro && p.perimetro.tipo === 'district' ? p.perimetro.id : null; }

  /** Regole di coerenza C1-C6 su una persona. Restituisce l'elenco degli errori (vuoto = valida). */
  function validaPersona(p) {
    var e = [];
    var area = p.perimetro && p.perimetro.tipo === 'area';
    if (isArea(p) && (p.argo !== 'completo' || !area)) e.push('C1: un Area Manager deve avere accesso completo e perimetro Area');
    if (isDistrict(p) && (p.argo !== 'completo' || !districtDi(p))) e.push('C2: un District Manager deve avere accesso completo e perimetro su un District');
    if (isPresidio(p) && (p.argo !== 'completo' || !area)) e.push('C3: il Presidio deve avere accesso completo e perimetro Area');
    if (!p.funzione && p.argo === 'nessuno' && !p.accertamenti && !p.admin) e.push('C4: senza funzione e senza accesso ad ARGO deve essere abilitato agli accertamenti');
    return e;
  }

  /** Coerenza dell'elenco: un solo Area Manager, un solo District Manager per District. */
  function validaPersone(persone) {
    var e = [];
    var aree = persone.filter(isArea);
    if (aree.length > 1) e.push('C1: un solo Area Manager per Area');
    var visti = {};
    persone.filter(isDistrict).forEach(function (p) {
      var d = districtDi(p);
      if (visti[d]) e.push('C2: il District ' + d + ' ha già un District Manager');
      visti[d] = true;
    });
    persone.forEach(function (p) { validaPersona(p).forEach(function (x) { e.push(p.nome + ' – ' + x); }); });
    return e;
  }

  /**
   * C6: solo chi è abilitato agli accertamenti può stare in una squadra.
   * Un District Manager può essere in squadra anche in altri District: la squadra la organizza
   * il Presidio e la approva l'Area Manager (decisione 3B). In ARGO resta limitato al suo District.
   */
  function candidabiliInSquadra(persone) {
    return persone.filter(function (p) { return p.accertamenti; });
  }

  // ------------------------------------------------------------ perimetro
  /** La persona vede gli oggetti di quel District? */
  function vedeDistrict(p, districtId) {
    if (p.admin || isArea(p) || isPresidio(p)) return true;
    if (p.argo === 'nessuno') return false;
    if (p.perimetro && p.perimetro.tipo === 'area') return true;
    return districtDi(p) === districtId;
  }

  // ------------------------------------------------------------ permessi
  /*
   * puo(persona, azione, ctx) -> { ok: true } oppure { ok: false, motivo: '...' }
   * Il motivo serve alla demo per spiegare accanto al pulsante perché un'azione
   * non è permessa ("Solo l'Area Manager può autorizzare").
   *
   * ctx contiene gli oggetti coinvolti, per esempio { district: 'D1' },
   * { richiesta: {...} }, { esito: {...}, ora: '2026-11-14T10:00' }, { missione: {...} }.
   */
  function si() { return { ok: true }; }
  function no(motivo) { return { ok: false, motivo: motivo }; }
  function mioDistrict(p, d) { return isDistrict(p) && districtDi(p) === d; }

  // Azioni che l'Area Manager NON fa nemmeno con il suo libero arbitrio:
  // registrare esiti (solo chi è in squadra, sul campo) e gestire persone e permessi (amministratore).
  var FUORI_DAL_LIBERO_ARBITRIO = { 'esito.registra': 1, 'persone.gestisce': 1 };

  var AZIONI = {
    // --- catena della missione (DECISIONI.md, step 5)
    'richiesta.crea': function (p, c) {
      if (mioDistrict(p, c.district)) return si();
      return no(isDistrict(p) ? 'Puoi creare richieste solo per il tuo District' : 'Le richieste le crea il District Manager (o l\'Area Manager)');
    },
    'richiesta.approva': function () { return no('Solo l\'Area Manager approva le richieste'); },
    'richiesta.modifica': function () { return no('Solo l\'Area Manager può cambiare obiettivo e target'); },
    'proposta.crea': function (p, c) {
      if (!isPresidio(p)) return no('Scheda e squadra le organizza il Presidio');
      if (!c.richiesta || !STATI_DOPO_APPROVAZIONE[c.richiesta.stato]) return no('Il Presidio lavora su una richiesta solo dopo l\'approvazione dell\'Area Manager');
      return si();
    },
    'squadra.approva': function () { return no('La squadra la approva l\'Area Manager'); },
    'scheda.approva': function (p, c) {
      if (mioDistrict(p, c.district)) return si();
      return no('La Scheda la approva il District che ha fatto la richiesta');
    },
    'proposta.rimanda': function (p, c) {
      if (mioDistrict(p, c.district)) return si();
      return no('Possono chiedere modifiche l\'Area Manager e il District che ha fatto la richiesta');
    },
    'missione.annulla': function () { return no('Solo l\'Area Manager può annullare una missione'); },
    'missione.aggiornaTarget': function (p) { return isPresidio(p) ? si() : no('I target li aggiorna il Presidio'); },
    'missione.debriefing': function (p) { return isPresidio(p) ? si() : no('Il debriefing lo registra il Presidio'); },
    'settimana.conferma': function (p) { return isPresidio(p) ? si() : no('La conferma del lunedì la dà il Presidio'); },
    // --- esiti
    'esito.registra': function (p, c) {
      // lavoro da elenco: lo ha creato una persona per sé, sul proprio dispositivo
      if (c.missione && c.missione.daElenco) return c.missione.persona === p.id && puoCreareLavoroDaElenco(p).ok ? si() : no('Questo elenco è di un\'altra persona');
      if (!p.accertamenti) return no('Non sei abilitato agli accertamenti');
      if (!c.missione || (c.missione.squadra || []).indexOf(p.id) < 0) return no('Registra gli esiti solo chi è nella squadra della missione');
      if (STATI_REGISTRAZIONE_ESITI.indexOf(c.missione.stato) < 0) return no('La missione non è ancora autorizzata: gli esiti si registrano dopo l\'autorizzazione');
      return si();
    },
    'esito.corregge': function (p, c) {
      var e = c.esito;
      if (isPresidio(p)) return si();
      if (mioDistrict(p, e.district)) return si();
      if (e.autore === p.id) {
        var passate = new Date(c.ora) - new Date(e.inviatoIl);
        return passate <= GIORNO_MS ? si() : no('Puoi correggere un tuo esito solo entro 24 ore dall\'invio');
      }
      return no('Possono correggere l\'Area Manager, il Presidio, il District Manager del territorio e chi ha inserito l\'esito entro 24 ore');
    },
    'correzioni.vede': function (p, c) {
      if (isPresidio(p) || mioDistrict(p, c.district)) return si();
      return no('Il registro delle correzioni lo vedono Presidio, Area Manager e il District Manager del territorio');
    },
    // --- opportunità e segnalazioni (catena decisa allo step 5: 6A)
    'opportunita.crea': function (p, c) {
      if (isPresidio(p) || mioDistrict(p, c.district)) return si();
      return no('Le opportunità le inseriscono Area Manager, District Manager (nel proprio District) e Presidio');
    },
    'segnalazione.conferma': function (p, c) {
      if (isPresidio(p) || mioDistrict(p, c.district)) return si();
      return no('Le segnalazioni le confermano Area Manager, District Manager (nel proprio District) e Presidio');
    },
    'opportunita.valuta': function (p, c) {
      if (mioDistrict(p, c.district)) return si();
      return no(isPresidio(p) ? 'Valutare un\'opportunità spetta al District Manager o all\'Area Manager' : 'Puoi valutare solo le opportunità del tuo District');
    },
    'opportunita.statoOperativo': function (p) { return isPresidio(p) ? si() : no('Gli stati operativi delle opportunità li aggiorna il Presidio'); },
    'segnalazione.crea': function () { return si(); },
    // --- territorio

  function puo(p, azione, ctx) {

  // ------------------------------------------------------------ lavoro da elenco (IRIDE): un Excel caricato sul dispositivo

  /** Riga dei titoli: tra le prime 15 righe, la prima con almeno il 60% delle celle piene della riga più piena. */
  function trovaIntestazione(tutte) {

    var piene = function (r) { return r.filter(function (x) { return String(x || '').trim(); }).length; };

  // campi di un elenco e parole che li riconoscono, nell'ordine in cui si assegnano

  function numeroDa(v) {

  /**
   * Dalle righe del file ai locali da visitare. Le schede con stesso nome, indirizzo e comune diventano

   * opzioni: { statiTenuti: ['Validata', ...] } per tenere solo alcune righe (scelta dell'utente).
   * Le colonne personali non vengono conservate.
   */
  function righeElenco(intestazioni, righe, mappa, opzioni) {
    opzioni = opzioni || {};
    var tenuti = opzioni.statiTenuti ? opzioni.statiTenuti.map(function (s) { return String(s).trim(); }) : null;
    var val = function (r, campo) { return mappa[campo] != null ? String(r[mappa[campo]] == null ? '' : r[mappa[campo]]).trim() : ''; };
    var conservabili = intestazioni.map(function (h, i) { return i; }).filter(function (i) { return intestazioni[i] && !PERSONALI.test(intestazioni[i]); });
    var perChiave = {}, ordine = [], scartate = 0;
    righe.forEach(function (r) {

      if (tenuti && tenuti.indexOf(val(r, 'stato')) < 0) return;
      var chiave = normalizza(nome) + '|' + normalizza(val(r, 'indirizzo')) + '|' + normalizza(val(r, 'comune'));
      var l = perChiave[chiave];

        ordine.push(l);
      }
      var p = val(r, 'protocollo'); if (p && l.protocolli.indexOf(p) < 0) l.protocolli.push(p);
      l.importo += numeroDa(val(r, 'importo'));
      var s = val(r, 'stato'); if (s && l.stati.indexOf(s) < 0) l.stati.push(s);
      var a = val(r, 'atto'); if (a && l.atti.indexOf(a) < 0) l.atti.push(a);
      var orig = {}; conservabili.forEach(function (i) { var v = r[i]; if (v != null && String(v).trim()) orig[intestazioni[i]] = String(v).trim(); });
      l.righe.push(orig);

    ordine.forEach(function (l) { l.importo = Math.round(l.importo * 100) / 100; });

    ordine.sort(function (a, b) { return a.comune.localeCompare(b.comune, 'it') || a.indirizzo.localeCompare(b.indirizzo, 'it') || a.nome.localeCompare(b.nome, 'it'); });
    return { locali: ordine, righeLette: righe.length, senzaNome: scartate };

  /** Valori distinti della colonna stato, con quante righe ciascuno (per il filtro facoltativo). */
  function statiElenco(righe, mappa) {

    return Object.keys(conta).sort().map(function (s) { return { stato: s, righe: conta[s] }; });
  }

  /** Chi può creare un lavoro da elenco per sé: chi è abilitato agli accertamenti e l'amministratore della demo. */
  function puoCreareLavoroDaElenco(p) {

  }

  // ------------------------------------------------------------ MDA in campo (IRIDE): master, itinerari, navigazione

  // colonne del master: nome interno -> titoli riconosciuti (prima uguaglianza esatta, poi parole chiave)
  var COLONNE_MASTER = [
    ['protocollo', ['numero protocollo', 'protocollo scheda', 'n. protocollo'], /^(numero )?protocollo$|protocollo scheda|n\.? ?scheda/],

    ['comune', ['comune'], /comune|localit/],
    ['accentrata', ['accentrata', 'accentramento'], /accentrat/],

    ['mq', ['mq', 'superficie'], /^mq$|superficie/],

  function riconosciColonneMaster(intestazioni) {
    var n = intestazioni.map(function (h) { return String(h || '').toLowerCase().replace(/\s+/g, ' ').trim(); });
    var mappa = {}, usate = {};
    COLONNE_MASTER.forEach(function (c) {          // 1) titolo identico
      for (var i = 0; i < n.length; i++) if (!usate[i] && c[1].indexOf(n[i]) >= 0) { mappa[c[0]] = i; usate[i] = 1; return; }
    });

  /** Cella vuota «vera»: niente testo, solo spazi o un trattino. */
  function vuoto(v) { return !String(v == null ? '' : v).replace(/[\s\-–—]/g, ''); }

  /**
   * Dal master alle schede: una scheda per Numero Protocollo, anche se il file ha più righe

   * -> { schede, righeLette, conflitti, mappa, mancanti, ok }

  function leggiMaster(intestazioni, righe) {
    var r = riconosciColonneMaster(intestazioni);
    if (!r.ok) return { ok: false, mancanti: r.mancanti, mappa: r.mappa, schede: [], righeLette: righe.length, conflitti: [] };
    var m = r.mappa;
    var val = function (riga, campo) { return m[campo] != null ? String(riga[m[campo]] == null ? '' : riga[m[campo]]).trim() : ''; };
    var noti = {}; Object.keys(m).forEach(function (k) { noti[m[k]] = 1; });
    var perId = {}, schede = [], conflitti = [], lette = 0;
    righe.forEach(function (riga, i) {
      if (!riga.some(function (x) { return String(x == null ? '' : x).trim(); })) return;
      var prot = val(riga, 'protocollo'), nome = val(riga, 'locale');
      if (!prot && !nome) return;
      lette++;
      var id = prot || ('RIGA-' + (i + 1));
      var s = perId[id];
      var importo = vuoto(val(riga, 'importo')) ? null : numeroDa(val(riga, 'importo'));
      if (!s) {
        // comune vuoto: si ricava dall'indirizzo quando è scritto dopo il civico
        // comune vuoto: prima dalle Note Google Maps («…, via Roma 3, Fontebella (XX) - …»), poi da quanto segue il civico
        var comuneRiga = val(riga, 'comune'), comuneDa = '';

        s = perId[id] = { id: id, protocollo: prot, locale: nome, organizzatore: val(riga, 'organizzatore'), piva: val(riga, 'piva'), cf: val(riga, 'cf'),
          tipologia: val(riga, 'tipologia'), comune: comuneRiga, indirizzo: senzaNull(val(riga, 'indirizzo')), importo: importo,
          stato: val(riga, 'stato'), accentrata: val(riga, 'accentrata'), atto: val(riga, 'atto'), strumenti: [], mq: val(riga, 'mq'),

        var diversi = ['locale', 'comune', 'indirizzo', 'stato'].filter(function (c) { var v = c === 'indirizzo' ? senzaNull(val(riga, c)) : val(riga, c); return v && normalizza(v) !== normalizza(s[c]); });

  }

  /** «VIA X 9 null (null) null»: il sistema di origine scrive «null» dove il comune manca. Si toglie. */
  /**
   * Copia di sicurezza di una mandataria (esiti, segnalazioni, orari, comuni scritti a mano…) unita a quella sul telefono.
   * Non si perde niente: dove entrambe hanno un dato vale quello del telefono, il resto arriva dalla copia;
   * le schede del master arrivano dalla copia solo se sul telefono non c'è un master.
   */
  var MAPPE_COPIA = ['esiti', 'segnala', 'gemini', 'comuni', 'pin', 'geo', 'programma', 'codici', 'supporto', 'tipEscluse'];
  function unisciCopia(attuale, copia) {
    var out = Object.assign({}, copia, attuale);
    MAPPE_COPIA.forEach(function (k) { if (copia[k] || attuale[k]) out[k] = Object.assign({}, copia[k] || {}, attuale[k] || {}); });
    if (!(attuale.schede || []).length) { out.schede = copia.schede || []; out.master = copia.master || null; out.N = copia.N || 0; }
    var ids = {}; out.manuali = (attuale.manuali || []).concat(copia.manuali || []).filter(function (s) { if (ids[s.id]) return false; ids[s.id] = 1; return true; });
    var nuovi = Object.keys(copia.esiti || {}).filter(function (id) { return !(attuale.esiti || {})[id]; }).length;
    return { mandataria: out, esitiRecuperati: nuovi };
  }

  function senzaNull(indirizzo) {
    return String(indirizzo || '').replace(/\(\s*null\s*\)/gi, '').replace(/\bnull\b/gi, '').replace(/\s+/g, ' ').trim();
  }

  function eValidata(s) { return /^validat/i.test(String(s.stato || '').trim()); }
  function ePagata(s) { return /^pagat/i.test(String(s.stato || '').trim()); }
  function eAccentrata(s) { return /^s[iì]/i.test(String(s.accentrata || '').trim()); }

  /** Negli itinerari solo: Stato SM Validata, non accentrata, Protocollo Atto vuoto, nessun esito registrato. */
  function inItinerario(s, esito) {
    return eValidata(s) && !eAccentrata(s) && vuoto(s.atto) && !(esito && esito.esito);
  }

  /** Stato da mostrare e colore: pagata (verde), accertata (rosso: con atto), validata (giallo). */
  function statoScheda(s) {
    if (ePagata(s)) return { etichetta: vuoto(s.atto) ? 'Pagata' : 'Pagata · con atto', colore: 'verde' };
    if (!vuoto(s.atto)) return { etichetta: 'Accertata', colore: 'rosso' };
    if (eValidata(s)) return { etichetta: eAccentrata(s) ? 'Validata · accentrata' : 'Validata', colore: 'giallo' };
    return { etichetta: s.stato || 'Senza stato', colore: '' };
  }

  // Indirizzi del master in due formati: «VIA X - 44 - 00000» oppure «VIA X 44 COMUNE (PR) ...».
  var CIVICO = /^(\d+[a-z]?(\/\w+)?|snc|s\.?n\.?c\.?)$/i;
  /** Scompone un indirizzo in via, civico e (se c'è) comune scritto dopo il civico. */
  /** Comune scritto nelle Note Google Maps dopo l'indirizzo, con la sigla della provincia: «…, via Roma 3, Fontebella (XX)». */
  function comuneDaNote(note) {
    var re = /,\s*([A-Za-zÀ-ú'][A-Za-zÀ-ú' .-]{1,40}?)\s*\(([A-Z]{2})\)/g, m, ultimo = '';
    while ((m = re.exec(String(note || '')))) if (!/\d/.test(m[1])) ultimo = m[1].trim();
    return ultimo.toUpperCase();

  function scomponiIndirizzo(indirizzo) {

    s = s.split(/\(|,/)[0].trim();

    for (var i = 2; i < tk.length; i++) if (CIVICO.test(tk[i])) return { via: tk.slice(0, i).join(' '), civico: tk[i], dopo: tk.slice(i + 1).join(' ') };

  }
  /** La via di un indirizzo, senza civico, CAP e località: «VIA DEI TIGLI - 4 - 00000» -> «via dei tigli». */
  function viaDi(indirizzo) { return normalizza(scomponiIndirizzo(indirizzo).via); }
  /** Il civico si può usare per navigare? No se manca, se è SNC o «0». */
  function civicoUsabile(indirizzo) {
    var civ = scomponiIndirizzo(indirizzo).civico;
    return !!civ && /\d/.test(civ) && !/snc/i.test(civ) && !/^0(\/|$)/.test(civ);
  }
  /** Indirizzo pulito per Maps e OpenStreetMap: «via civico, comune». Il comune, se manca, viene da dopo il civico. */

  /** Le sedi (locali fisici) dalle schede: le schede dello stesso locale diventano una sosta. */
  function sediDaSchede(schede) {
    var perKey = {}, out = [];
    schede.forEach(function (s) {
      var k = sedeDi(s);
      if (!perKey[k]) { perKey[k] = { key: k, nome: s.locale, indirizzo: s.indirizzo, comune: s.comune, tipologia: s.tipologia, via: viaDi(s.indirizzo) || 'senza via', schede: [] }; out.push(perKey[k]); }
      perKey[k].schede.push(s);
    });

  }

  /**
   * Itinerari (bacini) dai criteri del manuale «Bacini, priorità e residui»:
   * 1) si parte dai blocchi di sedi sulla stessa via dello stesso comune (un nome di via uguale in due comuni non è continuità);
   * 2) i blocchi con meno del minimo di tappe (6) si uniscono al blocco più vicino: in linea d'aria se ci sono le posizioni,
   *    altrimenti nello stesso comune; tra comuni diversi solo se vicini (corridoio) o come ultima scelta;
   * 3) un itinerario oltre il massimo (12) si divide in parti uguali, seguendo il percorso più corto.
   * Il numero di itinerari emerge dai dati. Codice stabile: la prima sede in ordine alfabetico.
   * opzioni: { minimoTappe: 6, massimoTappe: 12, puntoDi(sede) -> {lat, lon} | null }

  function costruisciGiri(schede, opzioni) {

    var sedi = sediDaSchede(schede);
    // 1) blocchi per comune e via
    var blocchi = {}, chiavi = [];
    sedi.forEach(function (x) {
      var k = normalizza(x.comune) + '|' + x.via;

      blocchi[k].push(x);
    });
    var gruppi = chiavi.sort().map(function (k) { return { sedi: blocchi[k] }; });
    var centro = function (g) {
      var pts = g.sedi.map(puntoDi).filter(Boolean);
      if (!pts.length) return null;
      return { lat: pts.reduce(function (n, p) { return n + p.lat; }, 0) / pts.length, lon: pts.reduce(function (n, p) { return n + p.lon; }, 0) / pts.length };
    };
    var comuni = function (g) { var o = {}; g.sedi.forEach(function (x) { o[normalizza(x.comune)] = 1; }); return o; };
    var distanza = function (a, b) {

      return stessoComune ? 20000 : 1e7;                                        // senza posizioni: stesso comune, poi ultima scelta
    };
    var nome0 = function (g) { return g.sedi.map(function (x) { return x.key; }).sort()[0]; };
    // 2) unione dei blocchi piccoli con il più vicino
    for (var giro = 0; giro < 10000; giro++) {
      var piccoli = gruppi.filter(function (g) { return g.sedi.length < MIN; });
      if (!piccoli.length || gruppi.length < 2) break;
      piccoli.sort(function (a, b) { return a.sedi.length - b.sedi.length || nome0(a).localeCompare(nome0(b)); });
      var g = piccoli[0], migliore = null;
      gruppi.forEach(function (h) {

        if (!migliore || costo < migliore.costo || (costo === migliore.costo && nome0(h) < nome0(migliore.h))) migliore = { h: h, costo: costo };
      });
      g.sedi = g.sedi.concat(migliore.h.sedi);

    var finali = [];

      if (g.sedi.length <= MAX) { finali.push(g.sedi); return; }
      var ordinate = ordinaTappe(g.sedi.slice().sort(function (a, b) { return a.key.localeCompare(b.key); }), null, puntoDi);
      var k = Math.ceil(ordinate.length / MAX), dim = Math.ceil(ordinate.length / k);

    return finali.map(function (lista) {
      var perComune = {}, perVia = {};
      lista.forEach(function (x) { perComune[x.comune] = (perComune[x.comune] || 0) + 1; perVia[x.via] = (perVia[x.via] || 0) + 1; });
      var cs = Object.keys(perComune).sort(function (a, b) { return perComune[b] - perComune[a] || a.localeCompare(b, 'it'); });
      var vs = Object.keys(perVia).filter(function (v) { return v !== 'senza via'; }).sort(function (a, b) { return perVia[b] - perVia[a] || a.localeCompare(b); });
      var nome = titolo(cs[0]) + (cs.length > 1 ? ' + ' + (cs.length === 2 ? titolo(cs[1]) : (cs.length - 1) + ' comuni') : '') +
        (vs.length ? ' · ' + titolo(vs[0]) + (vs.length > 1 ? ' e altre ' + (vs.length - 1) : '') : '');

      return { key: 'g|' + lista.map(function (x) { return x.key; }).sort()[0], comune: cs[0], comuni: cs, nome: nome, sedi: lista, schede: schedeG,
        importo: Math.round(schedeG.reduce(function (n, s) { return n + (s.importo || 0); }, 0) * 100) / 100,

  }

  /**
   * Giro di giornata: se nell'itinerario restano meno tappe del minimo, si aggiungono quelle degli itinerari più vicini

  /** Pesi del profilo A con la progressione approvata: da 40/30 a 20/50 (densità/valore) fino al 10% residuo. */
  function pesiProfiloA(iniziali, residue) {

  }

  function chiusoPerSegnalazione(sc) { return /chius/i.test(sc.statoGoogle || '') || !!sc.chiusoOggi; }

  /**
   * Punteggio dei giri (profilo A): D densità, V valore, F facilità, E efficienza, ciascuno tra 0 e 1.
   * D = sedi su vie con almeno 2 sedi / sedi; V = importo / importo massimo tra i giri;
   * F = schede con fascia oraria indicata e senza segnalazione di chiusura / schede; E = 1 / comuni.
   * Aggiunge a ogni giro: componenti, punti, classe P1/P2/P3. Restituisce i giri ordinati per punti.
   */
  function punteggiGiri(giri, pesi) {

    giri.forEach(function (g) {
      var perVia = {}; g.sedi.forEach(function (x) { perVia[x.via] = (perVia[x.via] || 0) + 1; });
      var dense = g.sedi.filter(function (x) { return x.via !== 'senza via' && perVia[x.via] >= 2; }).length;
      var comuni = {}; g.sedi.forEach(function (x) { comuni[normalizza(x.comune)] = 1; });

      g.componenti = { D: g.sedi.length ? dense / g.sedi.length : 0, V: maxImp ? g.importo / maxImp : 0,

  /** Distanza in metri tra due punti {lat, lon} (in linea d'aria). */

  /** Il giro con la tappa aperta (con posizione) più vicina. puntoDi(sede) -> {lat, lon} | null. */
  function giroPiuVicino(giri, pos, puntoDi) {

  }

  /** Ordine delle tappe partendo dalla posizione: ogni volta la più vicina; quelle senza posizione in coda, nell'ordine del piano. */
  function ordinaTappe(sedi, pos, puntoDi) {

  /**

   * la tratta successiva parte dall'ultima destinazione della precedente. La prima parte dalla posizione del telefono.

      var p = puntoDi(x);

  // «Musica non tutelata» (decisione del proponente, 21/11/2026): chiude la scheda; la nota su cosa diffonde è consigliata, non obbligatoria [IPOTESI]
  // «Locale non visitato» (decisione del proponente, 21/11/2026): chiude la scheda come gli altri esiti
  var ESITI_MDA = ['AC', 'Apparecchi rimossi', 'Locale chiuso T', 'Locale chiuso D', 'NA', 'Musica non tutelata', 'Locale non visitato'];
  /** Un esito vuole una data valida; «Senza esito» (vuoto) riapre la scheda. */
  function validaEsitoMda(esito, data) {
    if (!esito) return si();
    if (ESITI_MDA.indexOf(esito) < 0) return no('Esito non previsto');
    if (!data || isNaN(new Date(data))) return no('Indica la data del sopralluogo');
    return si();
  }

  /** Nome del file atteso per una mandataria: «schede mda validate-pagate <nome>.xls/.xlsx». */
  function nomeFileMaster(nomeMandataria) { return 'schede mda validate-pagate ' + String(nomeMandataria || '').trim(); }

    var base = String(nomeFile || '').replace(/\.(xlsx?|csv)$/i, '').trim().toLowerCase().replace(/\s+/g, ' ');
    return base === nomeFileMaster(nomeMandataria).toLowerCase().replace(/\s+/g, ' ');
  }

  // ------------------------------------------------------------ orari di apertura (dal master o da OpenStreetMap)
  // Formati letti: «Lun-Ven: 09:00 - 13:00, 16:00 - 20:00; Sab: 10:00 - 12:00», «Lun-Dom: Aperto 24 ore»,
  // aperture notturne («18:00 - 02:00»), elenchi («Lun-Mar, Gio-Dom», «Lun e Dom») e il formato di OpenStreetMap
  // («Mo-Fr 09:00-13:00,16:00-20:00; Sa 10:00-12:00»). Numeri dei giorni come Date.getDay(): 0 = domenica.
  var GIORNI_IT = { dom: 0, lun: 1, mar: 2, mer: 3, gio: 4, ven: 5, sab: 6, su: 0, mo: 1, tu: 2, we: 3, th: 4, fr: 5, sa: 6 };
  var NOMI_GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];

  function giornoDa(t) {
    var k = normalizza(t).replace(/[^a-z]/g, '');
    return GIORNI_IT[k.slice(0, 3)] != null ? GIORNI_IT[k.slice(0, 3)] : GIORNI_IT[k.slice(0, 2)] != null ? GIORNI_IT[k.slice(0, 2)] : null;
  }

    var out = [];
    String(testo).split(/,|\se\s|\sand\s/i).forEach(function (pezzo) {
      var r = pezzo.trim().split(/\s*-\s*/);

  /** Testo degli orari -> { stato: 'documentato' | 'sconosciuto' | 'chiuso', giorni: { 0..6: [[inizio, fine], ...] } } (minuti dalla mezzanotte). */
  function leggiOrari(testo) {
    var t = String(testo || '').trim();
    if (!t) return { stato: 'sconosciuto', giorni: {} };
    if (/chiuso (definitivamente|temporaneamente)|permanently closed/i.test(t)) return { stato: 'chiuso', giorni: {} };
    if (/^(non |n\.d|da verificare)/i.test(t)) return { stato: 'sconosciuto', giorni: {} };
    t = t.replace(/\([^)]*\)/g, ' ');                                     // note tra parentesi
    if (/^24\/7$/.test(t.trim())) t = 'Mo-Su 00:00-24:00';
    var giorni = {}, trovato = false;
    t.split(';').forEach(function (seg) {
      var m = seg.match(/^\s*([A-Za-zÀ-ÿ ,\-]+?)\s*:?\s+((?:\d|aperto|chiuso|off|closed).*)$/i) || seg.match(/^\s*([A-Za-zÀ-ÿ ,\-]+?):\s*(.*)$/);
      if (!m) return;
      var gg = elencoGiorni(m[1]);
      if (!gg.length) return;
      var fasce = [];
      if (/24\s*ore|24\/7|00:00\s*-\s*24:00/i.test(m[2])) fasce.push([0, 1440]);
      else if (!/chiuso|off|closed/i.test(m[2])) {

          fasce.push([a, b]);

      gg.forEach(function (g) { giorni[g] = fasce; });
      trovato = true;
    });

      var re2 = /(\d{1,2})[:.](\d{2})\s*-\s*(\d{1,2})[:.](\d{2})/g, y, tutti = [];
      while ((y = re2.exec(t))) { var a2 = minuti(y[1], y[2]), b2 = minuti(y[3], y[4]); if (b2 <= a2) b2 += 1440; tutti.push([a2, b2]); }

    return { stato: 'documentato', giorni: giorni };
  }

  /** «Giorno di chiusura» -> il giorno indicato è di chiusura? («Nessuno (…)» e «Non …» non chiudono mai). */
  function chiusoNelGiorno(testo, giorno) {
    var t = String(testo || '').trim();

    return elencoGiorni(t.replace(/\//g, ',')).indexOf(giorno) >= 0;
  }

  /**
   * Stato all'ora indicata: { stato: 'aperto' | 'apre' | 'chiuso' | 'sconosciuto', fino?, alle? }.

    var ieri = orari.giorni[(g + 6) % 7] || [], oggi = orari.giorni[g] || [];

    }

  }

  /**
   * Giri consigliati adesso (manuale «Bacini, priorità e residui», confronto del turno):
   * per ogni giro si contano le tappe aperte ora (orario documentato), quelle plausibili (orario non noto) e quelle
   * che aprono più tardi; il punteggio usa i pesi del profilo A con la progressione (densità e valore sulle tappe
   * lavorabili adesso, facilità = quota con orario documentato) e, se c'è la posizione, la vicinanza in linea d'aria.
   * Vicinanza (efficienza degli spostamenti) = 1 / (1 + km / 5) [IPOTESI: a 5 km vale la metà]; senza posizione 1 / numero di comuni.
   * Con la posizione vengono prima i giri con una tappa lavorabile entro 15 km [IPOTESI], poi gli altri.

    var righe = giri.map(function (g) {
      var aperte = [], plausibili = [], dopo = [];

      });
      var lav = aperte.concat(plausibili);
      var imp = function (l) { return Math.round(l.reduce(function (n, x) { return n + x.schede.reduce(function (m, s) { return m + (s.importo || 0); }, 0); }, 0) * 100) / 100; };
      var vicina = null;
      var cerca = function (sedi, stima) { sedi.forEach(function (x) { var p = puntoDi(x); if (p) { var d = distanzaMetri(pos, p); if (!vicina || d < vicina.metri) vicina = { sede: x, metri: d, stima: stima }; } }); };
      if (pos) {

  // ------------------------------------------------------------ passaggio tra ARGO e IRIDE (stessa persona, senza rientrare)

  function puoPassareAIride(p) {

  }

  // ------------------------------------------------------------ correzioni degli esiti
  /**

 *

 * sicurezza si scrivono nella cartella della mandataria (ARGO › nome), scelta una volta con la finestra di Google.

      if (!Elenchi.aggiungi(lavoro)) { toast('Memoria del dispositivo piena o non disponibile: elenco non salvato'); return; }
      try { sessionStorage.setItem('iride-missione', id); } catch (e) { /* */ }

  // ------------------------------------------------------------ invio verso ARGO (con coda se manca la rete)
  function invia(elemento) {
    if (!inLinea()) { DB.stato.codaIride.push(elemento); DB.salva(); return; }
    consegna(elemento); DB.salva();
  }
  function consegna(el) {
    var adesso = DB.ora();
    if (el.tipo === 'segnalazione') {
      el.dati.inviataIl = adesso;
      DB.stato.segnalazioni.push(el.dati);
      // l'autore va SOLO nel registro tecnico separato (in ARGO non si vede mai)
      DB.stato.registroTecnicoSegnalazioni.push({ segnalazione: el.dati.id, autore: el.autore });
    }
    if (el.tipo === 'esito') {
      var m = DB.stato.missioni.filter(function (x) { return x.id === el.missione; })[0]; if (!m) return;
      var i = m.esiti.findIndex(function (x) { return x.locale === el.dati.locale; });
      var rec = Object.assign({}, el.dati, { inviatoIl: i >= 0 && m.esiti[i].inviatoIl ? m.esiti[i].inviatoIl : adesso });
      if (i >= 0) m.esiti[i] = Object.assign({}, m.esiti[i], rec); else m.esiti.push(rec);
      if (m.stato === 'pronta' || m.stato === 'validata') { m.stato = 'eseguita'; }
      DB.annota(el.autore, 'esito inviato', { missione: m.id, locale: el.dati.locale });
    }
    if (el.tipo === 'esito-tolto') {
      var mm = DB.stato.missioni.filter(function (x) { return x.id === el.missione; })[0];
      if (mm) mm.esiti = mm.esiti.filter(function (x) { return x.locale !== el.locale; });
    }
    if (el.tipo === 'locale-nuovo') DB.stato.localiNuoviCampo.push(Object.assign({ inviatoIl: adesso }, el.dati));
  }
  function svuotaCoda() {
    if (!inLinea() || !DB.stato.codaIride.length) return;
    var n = DB.stato.codaIride.length;
    DB.stato.codaIride.splice(0).forEach(consegna);
    DB.salva(); toast(n + ' elementi inviati ad ARGO');
  }
  window.addEventListener('online', function () { svuotaCoda(); render(); });
  window.addEventListener('offline', function () { render(); });

  // ------------------------------------------------------------ esiti

  var SEZ2 = { A: 'Accertati', L: 'Con licenza già prima dell\'accertamento', X: 'Non accertati', N: 'NA' };
  function tp(k) { var o = TIPO[k]; return (o && o.v) || ''; }
  function tord(k) { var v = tp(k); return v === 'E' ? 0 : v === 'M' ? 1 : 2; }
  var CRT = { '1': 'Organizzatore ostile: ha impedito il controllo', '2': 'Errore app di rilevazione', '3': 'Altro' };

  function crN(k) { var o = CRIT[k]; return (o && o.n) || ''; }

  function tfOk(k) { return !tf || (tf === '-' ? !tp(k) : tp(k) === tf); }

  /** Dopo l'invio l'accertatore può cambiare il suo esito solo entro 24 ore, con un motivo (regole.js). */
  function puoCambiare(k) {

  function registra(k, motivo) {
    var s = S[k];
    var fuori = !MIS.targetOperativi.some(function (t) { return t.locale === k; });
    var dati = s ? { locale: k, valore: s.e, tipo: tp(k) === 'E' ? 'Eventi' : tp(k) === 'M' ? 'MDA' : '', crit: cr(k), critNote: crN(k), nota: s.n || '',
      autore: io.id, district: MIS.district, fuoriTarget: fuori || undefined } : null;
    var inv = esitoInviato(k);
    if (inv && inv.inviatoIl && dati && motivo) {
      var c = { esito: MIS.id + '/' + k, campo: 'valore', prima: inv.valore, dopo: dati.valore, chi: io.id, quando: DB.ora(), motivo: motivo, missione: MIS.id, locale: k, district: MIS.district };
      DB.stato.correzioni.push(c);
      dati.corretto = true; dati.storia = (inv.storia || []).concat([c]);
    }
    if (MIS.daElenco) {

        return '<option value="' + c + '"' + (cr(x.k) === c ? ' selected' : '') + '>' + c + ') ' + CRT[c] + '</option>'; }).join('') + '</select>' +

  // ------------------------------------------------------------ schermata «Missione»: riepilogo

  // ------------------------------------------------------------ schermate «Locali» ed «Esiti»: ricerca, filtri, elenco
  var NOMI_LISTE = [['sc', 'Target'], ['ev', 'Eventi'], ['ce', 'Cerimonie'], ['all', 'Tutti']];
  function cerca(x) { return (x.n + ' ' + x.a + ' ' + x.c + ' ' + (x.q || '') + ' ' + (x.e || '') + ' ' + (x.t || '')).toLowerCase().indexOf(q) >= 0; }
  function vistaLista() {
    var es = tab === 'es';
    var list = es ? allUniq().filter(function (x) { return S[x.k] && (!sez || S[x.k].e === sez) && tfOk(x.k); }).sort(function (a, b) {
      return (S[a.k].e === 'L') - (S[b.k].e === 'L') || tord(a.k) - tord(b.k) || 'AXNL'.indexOf(S[a.k].e) - 'AXNL'.indexOf(S[b.k].e) || S[b.k].t - S[a.k].t; }) : LISTS[tab];
    var comuni = ['Tutti'], cats = {};

    if (comuni.indexOf(comune) < 0) comune = 'Tutti';

        '<span class="et">Tipo di locale e orario</span><div class="selrow">' + sel('fcat', cat, [['', 'Ogni tipo di locale']].concat(Object.keys(cats).sort().map(function (k) { return [k, k]; }))) + sel('ffas', fas, FAS) + '</div>' +

<script>/* argo-mappa.js */
/*
 * ARGO – mappa interattiva del territorio (demo)
 *
 * Disegna i comuni INVENTATI come regioni (celle di Voronoi: ogni punto della mappa
 * appartiene al comune più vicino). Non è una mappa geografica reale e non carica nulla
 * da internet. Funzioni pure per la geometria, una funzione per il disegno SVG.
 */
(function (radice) {
  'use strict';

  /** Taglia un poligono tenendo la parte più vicina ad «a» che a «b» (asse del segmento ab). */
  function taglia(poligono, a, b) {
    var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2, nx = b[0] - a[0], ny = b[1] - a[1];
    var dentro = function (p) { return (p[0] - mx) * nx + (p[1] - my) * ny <= 0; };
    var incrocio = function (p, q) {
      var dp = (p[0] - mx) * nx + (p[1] - my) * ny, dq = (q[0] - mx) * nx + (q[1] - my) * ny, t = dp / (dp - dq);
      return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
    };
    var out = [];
    for (var i = 0; i < poligono.length; i++) {
      var p = poligono[i], q = poligono[(i + 1) % poligono.length];
      if (dentro(p)) { out.push(p); if (!dentro(q)) out.push(incrocio(p, q)); }
      else if (dentro(q)) out.push(incrocio(p, q));
    }
    return out;
  }

  /** Celle di Voronoi dentro un rettangolo: { nome: [[x,y],...] }. */
  function celle(semi, larghezza, altezza) {
    var out = {};
    Object.keys(semi).forEach(function (n) {
      var pol = [[0, 0], [larghezza, 0], [larghezza, altezza], [0, altezza]];
      Object.keys(semi).forEach(function (m) { if (m !== n) pol = taglia(pol, semi[n], semi[m]); });
      out[n] = pol;
    });
    return out;
  }

  /** Numero pseudo-casuale stabile da una stringa (per posizionare i locali sempre nello stesso punto). */
  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }

  /** Punto dentro il poligono vicino al centro, stabile per ogni locale. */
  function puntoNellaCella(pol, centro, chiave) {
    for (var k = 0; k < 12; k++) {
      var ang = hash(chiave + k) * Math.PI * 2, r = 0.15 + hash(k + chiave) * 0.75;
      var lontano = pol.reduce(function (m, p) { return Math.max(m, Math.hypot(p[0] - centro[0], p[1] - centro[1])); }, 0) * 0.55;
      var p = [centro[0] + Math.cos(ang) * r * lontano, centro[1] + Math.sin(ang) * r * lontano];
      if (dentroPoligono(p, pol)) return p;
    }
    return centro;
  }
  function dentroPoligono(p, pol) {
    var c = false;
    for (var i = 0, j = pol.length - 1; i < pol.length; j = i++) {
      if (((pol[i][1] > p[1]) !== (pol[j][1] > p[1])) && (p[0] < (pol[j][0] - pol[i][0]) * (p[1] - pol[i][1]) / (pol[j][1] - pol[i][1]) + pol[i][0])) c = !c;
    }
    return c;
  }
  function centroide(pol) {
    var x = 0, y = 0, a = 0;
    for (var i = 0; i < pol.length; i++) {
      var p = pol[i], q = pol[(i + 1) % pol.length], f = p[0] * q[1] - q[0] * p[1];
      a += f; x += (p[0] + q[0]) * f; y += (p[1] + q[1]) * f;
    }
    return a ? [x / (3 * a), y / (3 * a)] : pol[0];
  }

  radice.ArgoMappa = { celle: celle, centroide: centroide, puntoNellaCella: puntoNellaCella, dentroPoligono: dentroPoligono, hash: hash };
  if (typeof module !== 'undefined' && module.exports) module.exports = radice.ArgoMappa;
})(this);
</script>
