      const fine = +b.textContent; if (!fine) return;
      const t0 = performance.now();
      const passo = (t) => { const k = Math.min(1, (t - t0) / 900); b.textContent = Math.round(fine * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(passo); };
      b.textContent = '0'; requestAnimationFrame(passo);
    });
  }

  // ------------------------------------------------------------ PANORAMICA
  // ---- mappa del territorio (interattiva)
  const M = window.ArgoMappa;
  function datiComuni() {
    const lpc = {}; R.licenzePerComune(S().licenze, S().locali).forEach((r) => (lpc[r.comune] = r));
    const out = {};
    S().districts.forEach((d) => d.comuni.forEach((c) => {
      const r = lpc[c] || { licenze: 0, locali: 0, rapporto: 0 };
      out[c] = { comune: c, district: d, locali: r.locali, licenze: r.licenze, rapporto: r.rapporto || 0,
        opp: S().opportunita.filter((o) => o.district === d.id && (DB.locale(o.locale) ? DB.locale(o.locale).comune === c : true) && !['chiusa', 'scartata'].includes(o.stato)),
        missioni: S().missioni.filter((m) => m.comuni.includes(c) && !['chiusa', 'annullata'].includes(m.stato)),
        segnalazioni: S().segnalazioni.filter((s) => s.comune === c && s.stato === 'nuova') };
    }));
    return out;
  }
  function coloreRapporto(r, min, max) {
    const t = max > min ? (r - min) / (max - min) : 0.5;
    const a = [244, 168, 60], b = [63, 216, 200]; // ambra (poche licenze) → turchese (molte)
    const c = a.map((x, i) => Math.round(x + (b[i] - x) * t));
    return `rgba(${c[0]},${c[1]},${c[2]},.42)`;
  }
  function mappaSvg() {
    const conf = S().mappa, W = conf.larghezza, H = conf.altezza;
    const celle = M.celle(conf.semi, W, H), dc = datiComuni();
    const valori = Object.values(dc).filter((x) => vede(x.district.id)).map((x) => x.rapporto);
    const min = Math.min(...valori), max = Math.max(...valori);
    const visibili = Object.values(dc).filter((x) => vede(x.district.id));
    const minimo = visibili.length ? visibili.reduce((a, b) => (a.rapporto <= b.rapporto ? a : b)).comune : null;
    const path = (pol) => 'M' + pol.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L') + 'Z';
    let h = `<svg class="mappa" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mappa dei comuni inventati della demo"><defs>
      <filter id="alone" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
    Object.keys(celle).forEach((c) => {
      const x = dc[c], dentro = vede(x.district.id);
      // fuori dal perimetro: colore neutro, nessun dato (il District vede solo il suo)
      const fill = !dentro ? 'rgba(126,176,226,.06)' : livelli.rapporto ? coloreRapporto(x.rapporto, min, max) : 'rgba(126,176,226,.10)';
      h += `<path class="cella ${dentro ? '' : 'fuori'} ${comuneSel === c ? 'sel' : ''}" d="${path(celle[c])}" fill="${fill}" data-comune="${esc(c)}"></path>`;
    });
    // confini dei District: lati condivisi tra comuni di District diversi
    S().districts.forEach((d) => {
      d.comuni.forEach((c) => {
        const pol = celle[c];
        pol.forEach((p, i) => {
          const q = pol[(i + 1) % pol.length], mid = [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
          const bordo = mid[0] < 1 || mid[1] < 1 || mid[0] > W - 1 || mid[1] > H - 1;
          if (bordo) return;
          const oltre = [mid[0] + (mid[0] - M.centroide(pol)[0]) * 0.02, mid[1] + (mid[1] - M.centroide(pol)[1]) * 0.02];
          const vicino = Object.keys(celle).find((k) => k !== c && M.dentroPoligono(oltre, celle[k]));
          if (vicino && !d.comuni.includes(vicino)) h += `<line class="confine" x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}"></line>`;
        });
      });
    });
    Object.keys(celle).forEach((c) => {
      const x = dc[c], cen = M.centroide(celle[c]);
      if (!vede(x.district.id)) { h += `<text class="nome-comune" x="${cen[0].toFixed(1)}" y="${(cen[1] + 4).toFixed(1)}" text-anchor="middle" opacity=".55">${esc(c)}</text>`; return; }
      if (livelli.locali) S().locali.filter((l) => l.comune === c).forEach((l) => {
        const pt = M.puntoNellaCella(celle[c], cen, l.id);
        const ha = S().licenze.some((li) => li.locale === l.id);
        h += `<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="3" fill="${ha ? '#3fd8c8' : 'rgba(231,238,246,.55)'}" class="pin"></circle>`;
      });
      if (livelli.opportunita) x.opp.forEach((o, i) => { const pt = M.puntoNellaCella(celle[c], cen, 'o' + o.id); h += `<rect x="${(pt[0] - 7).toFixed(1)}" y="${(pt[1] - 7).toFixed(1)}" width="14" height="14" rx="3" fill="#6fb3ff" class="pin" filter="url(#alone)"></rect>`; });
      if (livelli.segnalazioni) x.segnalazioni.forEach((s) => { const pt = M.puntoNellaCella(celle[c], cen, 's' + s.id); h += `<path d="M${pt[0].toFixed(1)} ${(pt[1] - 10).toFixed(1)}l10 10-10 10-10-10z" fill="#ff7a6e" class="pin" filter="url(#alone)"></path>`; });
      if (livelli.missioni && x.missioni.length) {
        const px = cen[0] + 62, py = cen[1] - 34;
        h += `<g class="pin"><circle class="onda" cx="${px}" cy="${py}" r="18"></circle><circle cx="${px}" cy="${py}" r="12" fill="#f4a83c" filter="url(#alone)"></circle><text x="${px}" y="${py + 6}" text-anchor="middle" style="font:700 16px var(--mono);fill:#1b1206">${x.missioni.length}</text></g>`;
      }
      h += `<text class="nome-comune" x="${cen[0].toFixed(1)}" y="${(cen[1] - 4).toFixed(1)}" text-anchor="middle">${esc(c)}</text>`;
      h += `<text class="valore" x="${cen[0].toFixed(1)}" y="${(cen[1] + 22).toFixed(1)}" text-anchor="middle">${x.licenze}/${x.locali} lic.${c === minimo ? ' ▼' : ''}</text>`;
    });
    S().districts.forEach((d) => {
      const e = (conf.etichette || {})[d.id]; if (!e) return;
      h += `<text class="nome-district" x="${e[0]}" y="${e[1]}" text-anchor="middle">${esc(d.nome.toUpperCase())}</text>`;
    });
    return h + '</svg>';
  }

      <dl class="dati"><dt>Opportunità</dt><dd>${x.opp.length ? x.opp.map((o) => esc(nomeLocale(o.locale) || o.nomeLocale) + ' ' + et(STATO_OPP[o.stato])).join('<br>') : '–'}</dd>

        <button class="btn chiaro piccolo" data-vedi-locali="${esc(comuneSel)}">Vedi i locali</button></div>` : ''}

  const TAPPE = [['Raccolta esigenze', 'richiestaIl', -56], ['Approvazione richiesta', 'approvataIl', -42], ['Presa in carico', 'presaIl', -28], ['Scheda e squadra', 'propostaIl', -21],

  function lineaTempo(m) {

  function schedaMissione(m) {
    const prio = m.targetOperativi.filter((t) => t.priorita === 'prioritario'), sec = m.targetOperativi.filter((t) => t.priorita !== 'prioritario');
    const storico = (id) => { const p = S().missioni.filter((x) => x.id !== m.id && (x.esiti || []).some((e) => e.locale === id)).pop(); if (!p) return ''; const e = p.esiti.find((x) => x.locale === id); return `ultimo controllo ${dataIt(p.dataAccertamento)} · ${ESITO[e.valore]}`; };
    const riga = (t) => { const l = DB.locale(t.locale) || {}; const pr = priorita(l); return `<tr><td><b>${esc(l.nome)}</b><br><small>${esc(l.indirizzo)} · ${esc(l.categoria)}</small> ${l.nome ? maps(l) : ''}</td><td>${et([pr.livello, pr.livello === 'Alta' ? 'ambra' : ''])}</td><td>${t.evento ? esc(t.evento.e + ' · ' + t.evento.o) : '–'}</td><td><small>${esc(storico(t.locale))}</small></td></tr>`; };
    return `<div class="scheda"><header><div><div class="occhiello">Scheda Missione</div><h2>${esc(m.titolo || '')}</h2></div><div style="text-align:right">${m.stato === 'autorizzata' || m.stato === 'eseguita' || m.stato === 'chiusa' ? et(['Autorizzata', 'salvia']) : et([STATO_MIS[m.stato][0], 'ambra'])}<br><small class="perche">Preparata dal Presidio${m.urgente ? ' · Scheda ridotta' : ''}</small></div></header>
      <dl><dt>Mandataria</dt><dd>${esc(DB.district(m.district).mandataria)}</dd><dt>Comune / area</dt><dd>${esc(m.comuni.join(', '))}</dd>
        <dt>Finalità</dt><dd>${esc(m.target.join(' · '))}</dd><dt>Finestra</dt><dd>${dataIt(m.dataAccertamento)} · ${esc(m.finestra || '')}</dd>
        <dt>Squadra</dt><dd>${(m.squadra || []).map(nomePersona).map(esc).join(' + ') || 'da organizzare'} ${m.squadraApprovataIl ? '<small class="perche">(approvata dall\'Area Manager)</small>' : m.squadra && m.squadra.length ? '<small class="perche">(proposta dal Presidio)</small>' : ''}</dd>
        <dt>Target</dt><dd>${prio.length} prioritari · ${sec.length} secondari</dd>
        ${m.noteOperative ? `<dt>Note operative</dt><dd>${esc(m.noteOperative)}</dd>` : ''}</dl>
      <table class="reg"><tr><th>Target operativo</th><th>Priorità</th><th>Evento</th><th>Storico</th></tr>${prio.map(riga).join('')}${sec.length ? `<tr><td colspan="4"><h3 style="margin:8px 0 0">Secondari</h3></td></tr>${sec.map(riga).join('')}` : ''}</table></div>`;
  }

  // ---- moduli della catena
  function apriModale(html) { document.getElementById('modale').innerHTML = `<div class="modale"><div class="foglio">${html}</div></div>`; }
  function chiudiModale() { document.getElementById('modale').innerHTML = ''; }
  const campoTxt = (nome, etichetta, valore, extra) => `<label class="campo">${etichetta}<input name="${nome}" value="${esc(valore || '')}" ${extra || ''}></label>`;

  function moduloRichiesta(comune, urgente) {
    const dist = io.funzione === 'district' ? DB.district(io.perimetro.id) : null;
    const districts = dist ? [dist] : S().districts;
    const opp = S().opportunita.filter((o) => o.stato === 'da_accertare' && districts.some((d) => d.id === o.district));
    apriModale(`<form data-form="richiesta"><div class="occhiello">${urgente ? 'Corsia urgente' : 'Nuova richiesta motivata'}</div><h2>Proponi l'obiettivo</h2>
      <p class="perche">Il District propone l'obiettivo, non sceglie i locali: li individuerà il Presidio dopo l'autorizzazione dell'Area Manager.</p>
      ${dist ? `<input type="hidden" name="district" value="${dist.id}">` : `<label class="campo">District<select name="district">${S().districts.map((d) => `<option value="${d.id}">${esc(d.nome)}</option>`).join('')}</select></label>`}
      <label class="campo">Comuni<select name="comuni" multiple size="3">${districts.flatMap((d) => d.comuni).map((c) => `<option ${c === comune ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="campo">Target manageriale (uno per riga)<textarea name="target">${comune ? 'Capire perché ' + esc(comune) + ' ha poche licenze rispetto ai locali censiti' : ''}</textarea></label>
      ${opp.length ? `<div class="campo">Opportunità «da accertare» da collegare<div class="scelte-lista">${opp.map((o) => `<label><input type="checkbox" name="opp" value="${o.id}"><span>${esc(nomeLocale(o.locale) || o.nomeLocale)}<small>${esc(o.descrizione)}</small></span></label>`).join('')}</div></div>` : ''}
      <label class="campo"><span><input type="checkbox" name="urgente" ${urgente ? 'checked' : ''}> Urgente</span></label>
      <label class="campo">Se urgente, perché?<select name="tipoUrgenza"><option value="">–</option><option value="reale">Reale: fatto nuovo (evento, segnalazione)</option><option value="organizzativa">Organizzativa: programmazione tardiva</option></select></label>
      <div class="riga"><button class="btn ambra">Invia all'Area Manager</button><button type="button" class="btn chiaro" data-chiudi>Annulla</button></div><p class="perche" data-errori></p></form>`);
  }

  function moduloApprovaRichiesta(m) {
    apriModale(`<form data-form="approva-ric" data-id="${m.id}"><div class="occhiello">Area Manager</div><h2>Approva la richiesta</h2>
      <p class="perche">Approvata, la missione passa al Presidio, che organizza Scheda e squadra. Puoi cambiare l'obiettivo senza annullare la richiesta.</p>
      <label class="campo" for="ar-target">Target manageriale (uno per riga)<textarea id="ar-target" name="target">${esc(m.target.join('\n'))}</textarea></label>
      <label class="campo" for="ar-prio">Priorità<select id="ar-prio" name="priorita"><option>Alta</option><option selected>Media</option><option>Bassa</option></select></label>
      ${m.urgente ? '<p class="avviso">Richiesta urgente: il Presidio preparerà una Scheda ridotta.</p>' : ''}
      <div class="riga"><button class="btn ambra">Approva</button><button type="button" class="btn chiaro" data-chiudi>Annulla</button></div></form>`);
  }

  function ricercheWeb(l) {
    const b = `${l.nome} ${l.comune}`;
    return [`"${b}" eventi`, `${b} serate musica`, `${b} mappa`, `${b} pagina social`, `${b} locandina`];
  }

  function disponibiliIl(giorno) {
    return S().disponibilita.filter((r) => r.giorni.includes(giorno)).map((r) => r.persona);
  }

  function moduloProposta(m) {
    const locali = S().locali.filter((l) => m.comuni.includes(l.comune)).map((l) => ({ l, pr: priorita(l) }))
      .sort((a, b) => ({ Alta: 0, Media: 1, Bassa: 2 })[a.pr.livello] - ({ Alta: 0, Media: 1, Bassa: 2 })[b.pr.livello]);
    const daOpp = S().opportunita.filter((o) => (m.opportunita || []).includes(o.id)).map((o) => o.locale);
    const giorno = m.dataAccertamento ? m.dataAccertamento.slice(0, 10) : new Date(Date.now() + (m.urgente ? 1 : 10) * 864e5).toISOString().slice(0, 10);
    const candidati = R.candidabiliInSquadra(S().persone);
    const liberi = disponibiliIl(giorno);
    const proposti = (m.squadra && m.squadra.length ? m.squadra : candidati.filter((p) => liberi.includes(p.id)).slice(0, 2).map((p) => p.id));
    const disp = R.elencoDisponibilita(S().disponibilita);
    const presel = new Set(m.targetOperativi && m.targetOperativi.length ? m.targetOperativi.map((x) => x.locale) : daOpp.concat(locali.filter((x) => x.pr.livello === 'Alta').slice(0, 6).map((x) => x.l.id)));
    const prio = new Set((m.targetOperativi || []).filter((x) => x.priorita === 'prioritario').map((x) => x.locale));
    apriModale(`<form data-form="proposta" data-id="${m.id}"><div class="occhiello">Presidio · ${esc(m.comuni.join(', '))}</div><h2>${m.urgente ? 'Scheda ridotta e squadra' : 'Scheda Missione e squadra'}</h2>
      <p class="perche">Scegli i target operativi e organizza la squadra in base alle disponibilità. La proposta va insieme all'Area Manager (approva la squadra) e al District (approva la Scheda).</p>
      <div class="riga"><label class="campo" for="pr-data">Data dell'accertamento<input id="pr-data" name="data" type="date" value="${giorno}"></label><label class="campo" for="pr-fin">Finestra<input id="pr-fin" name="finestra" value="${esc(m.finestra || '21:00 – 01:00')}"></label></div>
      <div class="campo">Target operativi <span class="perche">ordinati per priorità (regole qualitative). Prima casella = target; seconda = prioritario.</span>
        <div class="scelte-lista">${locali.slice(0, 60).map(({ l, pr }) => `<label><input type="checkbox" name="t" value="${l.id}" ${presel.has(l.id) ? 'checked' : ''}><input type="checkbox" name="p" value="${l.id}" title="prioritario" ${prio.has(l.id) || (!prio.size && presel.has(l.id)) ? 'checked' : ''}>
          <span><b>${esc(l.nome)}</b> ${et([pr.livello, pr.livello === 'Alta' ? 'ambra' : ''])} ${daOpp.includes(l.id) ? et(['opportunità', 'mare']) : ''}<small>${esc(l.indirizzo)} · ${esc(l.categoria)} · ${esc(pr.motivazione)}</small></span>
          <button type="button" class="btn chiaro piccolo" data-ricerca="${l.id}">Ricerca web</button></label>`).join('')}</div></div>
      <div data-ricerche></div>
      <div class="campo">Squadra <span class="perche">la organizza il Presidio; l'Area Manager la approva e può cambiarla. ★ = disponibile nel giorno scelto. Elenco in ordine alfabetico, mai per numero di incarichi.</span>
        <div class="scelte-lista">${candidati.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'it')).map((p) => { const r = disp.find((x) => x.persona === p.id); return `<label><input type="checkbox" name="sq" value="${p.id}" ${proposti.includes(p.id) ? 'checked' : ''}><span><b>${esc(p.nome)}</b> ${liberi.includes(p.id) ? '★' : ''}<small>${esc(p.ruolo)} · ${r ? r.incarichi + ' incarichi nel mese' : 'disponibilità non dichiarata'}</small></span></label>`; }).join('')}</div></div>
      <label class="campo" for="pr-note">Note operative<input id="pr-note" name="note" value="${esc(m.noteOperative || '')}" placeholder="Vincoli, criticità, osservazioni"></label>
      <label class="campo"><span><input type="checkbox" name="briefing" ${m.briefing ? 'checked' : ''}> Briefing previsto/fatto (facoltativo)</span></label>
      <div class="riga"><button class="btn ambra">Invia ad Area Manager e District</button><button type="button" class="btn chiaro" data-chiudi>Annulla</button></div></form>`);
  }

  function moduloApprovaSquadra(m) {
    const candidati = R.candidabiliInSquadra(S().persone);
    const liberi = disponibiliIl(m.dataAccertamento.slice(0, 10));
    apriModale(`<form data-form="ok-squadra" data-id="${m.id}"><div class="occhiello">Area Manager</div><h2>Approva la squadra</h2>
      <p>Data: <b>${dataIt(m.dataAccertamento)}</b> · Finestra: ${esc(m.finestra)} · Target: ${m.targetOperativi.length}</p>
      <p class="perche">Squadra organizzata dal Presidio. Puoi cambiarla. Da questo momento parte il conteggio dell'anticipo e la squadra vede la missione in IRIDE come «in preparazione». ★ = disponibile quel giorno.</p>
      <div class="scelte-lista">${candidati.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'it')).map((p) => `<label><input type="checkbox" name="sq" value="${p.id}" ${m.squadra.includes(p.id) ? 'checked' : ''}><span><b>${esc(p.nome)}</b> ${liberi.includes(p.id) ? '★' : ''}<small>${esc(p.ruolo)}</small></span></label>`).join('')}</div>
      <div class="spazio"></div><div class="riga"><button class="btn ambra">Approva la squadra</button><button type="button" class="btn chiaro" data-chiudi>Annulla</button></div></form>`);
  }

  function moduloDebriefing(m) {
    apriModale(`<form data-form="debriefing" data-id="${m.id}"><div class="occhiello">Presidio</div><h2>Debriefing</h2>
      <p class="perche">Si valuta ogni target manageriale, non solo il conteggio degli esiti.</p>
      ${m.target.map((t, i) => `<label class="campo" for="db-${i}">${esc(t)}<select id="db-${i}" name="d${i}"><option>raggiunto</option><option selected>parzialmente</option><option>no</option></select></label>`).join('')}
      <div class="riga"><button class="btn ambra">Chiudi la missione</button><button type="button" class="btn chiaro" data-chiudi>Annulla</button></div></form>`);
  }

  // ------------------------------------------------------------ OPPORTUNITÀ
  function opportunita() {
    const opp = mieOpp();
    return `<div class="occhiello">Opportunità</div><h1 class="titolo">Ciò che merita attenzione</h1>
      <p class="sottotitolo">Le inseriscono Area Manager, District Manager (nel proprio District) e Presidio, oppure nascono da segnalazioni confermate da loro: sempre <b>prima</b> della missione. Valutarle («da accertare» o «scartata») spetta al District Manager o all'Area Manager. Un esito non crea opportunità.</p>
      <div class="riga">${az('Nuova opportunità', 'opportunita.crea', { district: io.perimetro.id || 'D1' }, 'data-nuova-opp', 'ambra')}</div><div class="spazio"></div>
      <div class="foglio">${opp.length ? `<table class="reg"><tr><th>Locale</th><th>Descrizione e fonte</th><th>Stato</th><th>Azioni</th></tr>${opp.map((o) => `<tr>
        <td><b>${esc(nomeLocale(o.locale) || o.nomeLocale)}</b><br><small>${esc(DB.district(o.district).nome)} · rilevata ${dataIt(o.rilevataIl)}</small></td>
        <td>${esc(o.descrizione)}<br><small class="perche">${esc(o.fonte)}${o.motivo ? ' · motivo: ' + esc(o.motivo) : ''}</small></td><td>${et(STATO_OPP[o.stato])}</td><td>${azioniOpp(o)}</td></tr>`).join('')}</table>` : '<p class="vuoto">Nessuna opportunità nel tuo perimetro.</p>'}</div>`;
  }
  function azioniOpp(o) {
    const out = [];
    if (o.stato === 'aperta' || o.stato === 'da_accertare') {
      if (o.stato === 'aperta') out.push(az('Da accertare', 'opportunita.valuta', { district: o.district }, `data-opp="${o.id}" data-stato="da_accertare"`, 'piccolo'));
      out.push(az('Scarta', 'opportunita.valuta', { district: o.district }, `data-opp="${o.id}" data-stato="scartata"`, 'piccolo chiaro'));
    }
    const prossimo = { missione_eseguita: 'follow_up_in_corso', follow_up_in_corso: 'follow_up_completato', follow_up_completato: 'chiusa' }[o.stato];
    if (prossimo) out.push(az('→ ' + STATO_OPP[prossimo][0], 'opportunita.statoOperativo', {}, `data-opp="${o.id}" data-stato="${prossimo}"`, 'piccolo chiaro'));
    if (o.stato === 'follow_up_completato') out.push(`<label class="perche"><input type="checkbox" data-censimento="${o.id}" ${o.censimentoAggiornato ? 'checked' : ''}> Censimento aggiornato</label>`);
    // spiegare sempre lo stato, così nessuna riga resta senza indicazioni
    const nota = {
      da_accertare: 'Già da accertare: può entrare in una richiesta del District.',
      assegnata: 'In una missione: la segue il Presidio.',
      missione_eseguita: 'Missione fatta: il Presidio decide il follow-up.',
      scartata: 'Scartata' + (o.motivo ? ': ' + o.motivo : '') + '.',
      chiusa: 'Chiusa.'
    }[o.stato];
    return `<div class="riga">${out.join('')}</div>${nota ? `<span class="perche">${esc(nota)}</span>` : ''}`;
  }
  function moduloNuovaOpp(daSegnalazione, comunePreso) {
    const s = daSegnalazione || (comunePreso ? { comune: comunePreso, finto: true } : null);
    apriModale(`<form data-form="opp" ${s && !s.finto ? `data-seg="${s.id}"` : ''}><div class="occhiello">Presidio</div><h2>${s && !s.finto ? 'Conferma la segnalazione' : 'Nuova opportunità'}</h2>
      <label class="campo">Locale<input name="loc" list="dl-loc" value="${esc(s && !s.finto ? (nomeLocale(s.locale) || s.nomeLocale) : '')}" required><datalist id="dl-loc">${S().locali.map((l) => `<option value="${esc(l.nome)}">${esc(l.comune)}</option>`).join('')}</datalist></label>
      <label class="campo">Comune<select name="comune">${S().districts.filter((d) => vede(d.id)).flatMap((d) => d.comuni).map((c) => `<option ${s && s.comune === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></label>
      <label class="campo">Descrizione<input name="descr" value="${esc(s && !s.finto ? (s.tipo + ': ' + (s.descrizione || 'segnalazione da IRIDE')) : '')}" required></label>
      <label class="campo">Fonte<input name="fonte" value="${s && !s.finto ? 'Segnalazione confermata (IRIDE)' : io.funzione === 'presidio' ? 'Ricerca del Presidio (simulata)' : 'Inserita da ' + io.nome + ' (' + io.ruolo + ')'}"></label>
      <div class="riga"><button class="btn ambra">${s && !s.finto ? 'Conferma e crea l\'opportunità' : 'Crea'}</button><button type="button" class="btn chiaro" data-chiudi>Annulla</button></div></form>`);
  }

  // ------------------------------------------------------------ SEGNALAZIONI
  function segnalazioni() {
    const ss = mieSegn().slice().reverse();
    return `<div class="occhiello">Segnalazioni</div><h1 class="titolo">Dal territorio, da chiunque</h1>
      <p class="sottotitolo">Inviate da IRIDE, anche fuori orario. Diventano opportunità solo se le conferma l'Area Manager, il District Manager del territorio o il Presidio. <b>Anonime</b>: in ARGO non compare chi ha segnalato (il nome resta in un registro tecnico separato, aperto solo in caso di abuso con Legal/DPO). Una segnalazione non è un accertamento.</p>
      <p class="avviso">Regole sulle segnalazioni fuori orario in definizione con HR. Foto: da discutere con Legal/DPO.</p>
      <div class="foglio">${ss.length ? `<table class="reg"><tr><th>Quando</th><th>Locale</th><th>Tipo e descrizione</th><th>Incrocio licenze/MDA</th><th>Stato</th><th></th></tr>${ss.map((s) => {
        const inc = s.locale ? R.incrociaSegnalazione(s, S().licenze, S().mda) : 'da_accertare';
        return `<tr><td class="num">${dataOraIt(s.data)}</td><td><b>${esc(nomeLocale(s.locale) || s.nomeLocale)}</b><br><small>${esc(s.comune)}${s.locale ? '' : ' · non nel Censimento'}</small></td>
          <td>${esc(s.tipo)}${s.descrizione ? ' – ' + esc(s.descrizione) : ''}${s.foto ? `<br><img src="${s.foto}" alt="foto della segnalazione" style="max-width:120px;border-radius:4px;margin-top:4px">` : ''}</td>
          <td>${et(INCROCIO[inc])}</td><td>${et([s.stato, s.stato === 'nuova' ? 'ambra' : ''])}</td>
          <td>${s.stato === 'nuova' ? `<div class="riga">${az('Conferma', 'segnalazione.conferma', { district: s.district }, `data-conferma-seg="${s.id}"`, 'piccolo')}${az('Archivia', 'segnalazione.conferma', { district: s.district }, `data-archivia-seg="${s.id}"`, 'piccolo chiaro')}</div>` : ''}</td></tr>`; }).join('')}</table>` : '<p class="vuoto">Nessuna segnalazione nel tuo perimetro. Provane una da IRIDE (pulsante 📣).</p>'}</div>`;
  }

  // ------------------------------------------------------------ ESITI E CORREZIONI
  function esiti() {
    const righe = [];
    mieMissioni().forEach((m) => (m.esiti || []).filter((e) => e.inviatoIl).forEach((e) => righe.push({ m, e })));
    const nuove = correzioniNonLette();
    const vedeReg = ['area', 'presidio', 'district'].includes(io.funzione); // il District vede solo il suo (filtro qui sotto)
    const reg = S().correzioni.filter((c) => vede(c.district));
    return `<div class="occhiello">Esiti e correzioni</div><h1 class="titolo">Ciò che torna dal campo</h1>
      <p class="sottotitolo">Esiti interni registrati in IRIDE (l'accertamento ufficiale resta nell'app ufficiale). Arrivano subito, marcati «non rivisto» finché il Presidio non li guarda. Ogni correzione ha un motivo e resta nel registro.</p>
      ${nuove.length ? `<div class="foglio" style="border-color:var(--ambra)"><h2>Correzioni</h2><p class="perche">Correzioni agli esiti del tuo District (questa sezione compare solo quando ce n'è una).</p>
        <table class="reg">${nuove.map((c) => `<tr><td>${esc(nomeLocale(c.locale))}</td><td>${esc(ESITO[c.prima])} → <b>${esc(ESITO[c.dopo])}</b></td><td>${esc(c.motivo)}</td><td>${esc(nomePersona(c.chi))} · ${dataOraIt(c.quando)}</td></tr>`).join('')}</table>
        <div class="spazio"></div><button class="btn piccolo" data-letto>Segna come lette</button></div><div class="spazio"></div>` : ''}
      <div class="foglio">${righe.length ? `<table class="reg"><tr><th>Missione</th><th>Locale</th><th>Esito</th><th>Tipo · criticità</th><th>Inviato</th><th></th></tr>${righe.map(({ m, e }) => `<tr>
        <td><small>${esc(m.titolo || m.id)}</small></td><td><b>${esc(nomeLocale(e.locale))}</b></td>
        <td>${esc(ESITO[e.valore])}${e.corretto ? ' ' + et(['corretto', 'mare']) : ''}${e.rivisto ? '' : ' ' + et(['non rivisto', 'ambra'])}${e.fuoriTarget ? ' ' + et(['fuori dai target', '']) : ''}</td>
        <td><small>${esc(e.tipo || 'tipo da scegliere')}${e.crit ? ' · criticità ' + esc(e.crit) + (e.critNote ? ': ' + esc(e.critNote) : '') : ''}</small></td>
        <td class="num"><small>${esc(nomePersona(e.autore))} · ${dataOraIt(e.inviatoIl)}</small></td>
        <td><div class="riga">${e.rivisto ? '' : az('Rivisto', 'missione.debriefing', {}, `data-rivisto="${m.id}|${e.locale}"`, 'piccolo chiaro')}
          ${az('Correggi', 'esito.corregge', { esito: Object.assign({}, e, { district: m.district }), ora: DB.ora() }, `data-correggi="${m.id}|${e.locale}"`, 'piccolo chiaro')}</div></td></tr>`).join('')}</table>` : '<p class="vuoto">Nessun esito ancora. Registrane uno da IRIDE (per esempio entrando come Davide).</p>'}</div>
      ${vedeReg && reg.length ? `<div class="spazio"></div><div class="foglio"><h2>Registro delle correzioni</h2><table class="reg"><tr><th>Quando</th><th>Locale</th><th>Prima → dopo</th><th>Motivo</th><th>Chi</th></tr>${reg.map((c) => `<tr><td class="num">${dataOraIt(c.quando)}</td><td>${esc(nomeLocale(c.locale))}</td><td>${esc(ESITO[c.prima])} → ${esc(ESITO[c.dopo])}</td><td>${esc(c.motivo)}</td><td>${esc(nomePersona(c.chi))}</td></tr>`).join('')}</table></div>` : ''}`;
  }

        <div class="griglia g2">

          ${area('mda', 'MDA · musica d\'ambiente', 'Excel dei locali per MDA: locale, indirizzo, comune, stato della scheda (validata, pagata) e colonna «Accertato» con il numero di atto presente nel gestionale. Colonne provvisorie, in attesa dell\'Excel vero.')}
        </div>`;

  // ---- lettura dei file nel browser (nulla viene inviato): modulo comune file.js
  const leggiFile = (file) => window.LettoreFile.leggiFile(file);

  /** Carica le righe di un elenco (licenze per eventi oppure MDA) con tutti i controlli. */
  function caricaElenco(tipo, intestazioni, righe, nomeFile) {
    const quando = DB.ora();
    const tipoColonne = tipo === 'mda' ? 'mda' : 'licenze';
    const r = R.riconosciColonne(tipoColonne, intestazioni);
    if (!r.ok) {
      const altro = R.riconosciColonne(tipoColonne === 'mda' ? 'licenze' : 'mda', intestazioni).ok;
      S().caricamenti.push({ tipo, quando, chi: io.id, file: nomeFile, esito: 'bloccato', dettaglio: r.motivo + (altro ? '. Sembra un file dell\'altro elenco: controlla dove lo stai caricando.' : '') + ' Nulla è stato modificato.' });
      salva('File bloccato: nessun dato caricato'); return;
    }
    const indice = {}; intestazioni.forEach((h, i) => { if (r.mappa[h]) indice[r.mappa[h]] = i; });
    const val = (riga, campo) => (indice[campo] != null ? String(riga[indice[campo]] || '').trim() : '');
    const nuovi = righe.filter((riga) => val(riga, 'locale')).map((riga, i) => {
      const base = { id: (tipo === 'mda' ? 'MDA-' : 'LIC-') + Date.now().toString(36) + i, nomeFile: val(riga, 'locale'), indirizzo: val(riga, 'indirizzo'), comune: val(riga, 'comune'), caricatoIl: quando.slice(0, 10), elenco: tipo === 'mda' ? 'MDA' : 'Eventi e licenze' };
      if (tipo === 'mda') {
        const stato = val(riga, 'stato').toLowerCase();
        Object.assign(base, { nome: base.nomeFile, tipologia: val(riga, 'tipologia'), validata: /validat/.test(stato), pagata: /pagat/.test(stato) && !/non pagat/.test(stato), atto: val(riga, 'accertato') });
      } else {
        const date = val(riga, 'date');
        Object.assign(base, { numeroEventi: +val(riga, 'numero eventi') || 1, eventiUsati: 0, genere: val(riga, 'genere manifestazione'), ingresso: val(riga, 'modalità di ingresso'), date: date ? date.split(/[,;]\s*/) : undefined });
      }
      base.abbinamento = R.abbina({ locale: base.nomeFile, indirizzo: base.indirizzo, comune: base.comune }, S().locali, S().memoriaAbbinamenti);
      base.locale = base.abbinamento.stato === 'confermato' ? base.abbinamento.locale : null;
      base.confermato = base.abbinamento.stato === 'confermato';
      // abbinamento esatto (stesso nome, indirizzo e comune): proposto ma praticamente certo; resta da confermare
      return base;
    });
    const comuni = new Set(nuovi.map((x) => x.comune));
    const elenco = tipo === 'mda' ? 'mda' : 'licenze';
    const prima = S()[elenco].filter((x) => comuni.has(x.comune)).map((x) => ({ locale: x.nomeFile || x.nome || nomeLocale(x.locale), indirizzo: x.indirizzo }));
    const diff = R.differenze(prima, nuovi.map((x) => ({ locale: x.nomeFile, indirizzo: x.indirizzo })));
    const applica = () => {
      S()[elenco] = S()[elenco].filter((x) => !comuni.has(x.comune)).concat(nuovi);
      const daConfermare = nuovi.filter((x) => x.abbinamento.stato === 'proposto').length;
      S().caricamenti.push({ tipo, quando, chi: io.id, file: nomeFile, esito: 'accettato', dettaglio: `colonne riconosciute ${Object.keys(r.mappa).length}${r.scartate.length ? '; scartate perché personali: ' + r.scartate.join(', ') : ''}; comuni sostituiti: ${[...comuni].join(', ')}; righe ${nuovi.length} (nuove ${diff.nuovi.length}, sparite ${diff.spariti.length}${diff.allarme ? ', oltre il 30%: confermato da chi carica' : ''}); abbinamenti da confermare in coda: ${daConfermare}` });
      salva(daConfermare ? 'Caricamento accettato: ' + daConfermare + ' abbinamenti in coda' : 'Caricamento accettato');
    };
    if (diff.allarme) DB.chiedi({ titolo: 'Sparisce più del 30% delle righe', testo: `Rispetto al caricamento precedente spariscono ${diff.spariti.length} righe su ${prima.length} nei comuni del file. Il file potrebbe essere incompleto. Vuoi caricarlo comunque?`, conferma: 'Carica comunque' }, applica);
    else applica();
  }

  // ------------------------------------------------------------ MDA
  function mda() {
    const righe = S().mda.filter((x) => { const l = DB.locale(x.locale); return l ? vede(l.district) : S().districts.some((d) => vede(d.id) && d.comuni.includes(x.comune)); });
    const stato = (x) => (x.pagata ? et(['pagata', 'salvia']) : x.atto ? et(['già accertata · atto ' + x.atto, 'salvia']) : et(['da accertare', 'mare']));
    return `<div class="occhiello">MDA · musica d'ambiente</div><h1 class="titolo">Schede MDA</h1>
      <p class="avviso info"><b>Struttura provvisoria.</b> Il proponente fornirà l'Excel che mostra la struttura delle schede MDA: questa sezione si completerà su quella base. Il caricamento è in «Locali e licenze → Caricamenti».</p>
      <p class="sottotitolo">Una scheda può essere <b>validata ma non pagata e già accertata</b>, con il numero di atto di constatazione presente nel gestionale (colonna «Accertato»): in quel caso non torna tra quelle da accertare.</p>
      <div class="foglio">${righe.length ? `<table class="reg"><tr><th>Locale</th><th>Comune</th><th>Tipologia</th><th>Validata</th><th>Stato</th></tr>${righe.slice(0, 120).map((x) => `<tr><td><b>${esc(x.nome || nomeLocale(x.locale))}</b>${x.locale ? '' : ' ' + et(['da abbinare', 'ambra'])}<br><small>${esc(x.indirizzo)}</small></td><td>${esc(x.comune)}</td><td>${esc(x.tipologia || '')}</td><td>${x.validata === false ? 'no' : 'sì'}</td><td>${stato(x)}</td></tr>`).join('')}</table>` : '<p class="vuoto">Nessuna scheda MDA nel tuo perimetro.</p>'}</div>`;
  }

  // ------------------------------------------------------------ INDICATORI
  function indicatori() {
    const p = R.puo(io, 'indicatori.vede', { district: io.perimetro.id });
    if (!p.ok && io.funzione !== 'area' && io.funzione !== 'presidio') return `<h1 class="titolo">Indicatori</h1><p class="avviso">${esc(p.motivo)}</p>`;
    const ms = mieMissioni().filter((m) => m.stato !== 'richiesta');
    const k = R.indicatori(ms);
    const B = S().baseline, O = S().obiettivi;
    const rest = ms.filter((m) => (m.esiti || []).some((e) => e.inviatoIl) || m.esiti && m.esiti.length && m.stato === 'chiusa');
    const tempi = rest.map((m) => { const inv = (m.esiti || []).map((e) => e.inviatoIl).filter(Boolean).sort().pop(); return inv ? Math.max(0, giorniTra(m.dataAccertamento, inv)) : 2; });
    const tRest = tempi.length ? tempi.reduce((a, b) => a + b, 0) / tempi.length : null;
    const opp = mieOpp();
    const assegnate = opp.filter((o) => !['aperta', 'da_accertare', 'scartata'].includes(o.stato)).length;
    const riga = (nome, spiega, base, pil, obi) => `<div class="kpi"><div class="nome">${nome}<small>${spiega}</small></div><div><span class="p">prima</span> <span class="v">${base}</span></div><div><span class="p">pilota</span> <span class="v">${pil}</span></div><div class="p">${obi ? 'obiettivo ' + esc(obi) : ''}</div></div>`;
    return `<div class="occhiello">Indicatori</div><h1 class="titolo">Misurare il sistema, non le persone</h1>
      <p class="avviso"><b>Valori inventati a scopo dimostrativo.</b> «Prima» = baseline ricostruita su missioni recenti; «pilota» = calcolato dalle missioni della demo nel tuo perimetro. Le soglie di successo le fissa l'azienda.</p>
      <div class="foglio"><h3>Processo</h3>
        ${riga('Anticipo medio di programmazione', 'giorni tra la validazione (data e squadra fissate) e l\'accertamento', uno(B.anticipoMedio) + ' gg', uno(k.anticipoMedio) + ' gg', '')}
        ${riga('Missioni con almeno 7 giorni di anticipo', '', perc(B.quotaAlmeno7Giorni), perc(k.quotaAlmeno7Giorni), O.quotaAlmeno7Giorni)}
        ${riga('Tasso di urgenza', `missioni urgenti sul totale · di cui organizzative: ${k.urgenzeOrganizzative}`, perc(B.tassoUrgenza), perc(k.tassoUrgenza), O.tassoUrgenza)}
        ${riga('Rispetto del piano', 'missioni realizzate su programmate', perc(B.rispettoPiano), perc(k.rispettoPiano), '')}
        ${riga('Tempo di restituzione', 'giorni tra accertamento ed esiti in ARGO', uno(B.tempoRestituzioneGiorni) + ' gg', uno(tRest) + ' gg', '')}
        ${riga('Completezza del ciclo', 'autorizzazione · scheda · esiti · debriefing', perc(B.cicloCompleto), perc(k.cicloCompleto), '')}
      </div><div class="spazio"></div>
      <div class="foglio"><h3>Tracciatura delle opportunità</h3>
        ${riga('Tasso di presa in carico', 'opportunità assegnate su individuate', '–', opp.length ? perc(assegnate / opp.length) : '–', O.presaInCarico)}
        ${riga('Opportunità individuate', 'nel perimetro', '–', String(opp.length), '')}
      </div>`;
  }

  // ------------------------------------------------------------ azioni
  function richiestaDa(f) {
    const v = (n) => (f.elements[n] ? f.elements[n].value : '');
    const comuni = [...f.elements.comuni.selectedOptions].map((o) => o.value);
    const r = { target: v('target').split('\n').map((s) => s.trim()).filter(Boolean), urgente: f.elements.urgente.checked, tipoUrgenza: v('tipoUrgenza') || null };
    const district = v('district');
    const errori = R.validaRichiesta(r).concat(comuni.length ? [] : ['Scegli almeno un comune']);
    const perm = R.puo(io, 'richiesta.crea', { district, urgente: r.urgente });
    if (!perm.ok) errori.push(perm.motivo);
    if (errori.length) { f.querySelector('[data-errori]').textContent = errori.join(' · '); return; }
    const id = DB.nuovoId('MIS', S().missioni);
    S().missioni.push(Object.assign(r, { id, district, comuni, stato: 'richiesta', titolo: `Missione ${comuni.join(', ')}`, richiestaIl: DB.ora(), richiestaDa: io.id,
      opportunita: [...f.querySelectorAll('[name=opp]:checked')].map((x) => x.value), targetOperativi: [], esiti: [], squadra: [], iride: { S: {}, TIPO: {}, CRIT: {}, NEW: [] } }));
    DB.annota(io.id, 'richiesta creata', { missione: id });
    chiudiModale(); selMissione = id; sezione = 'missioni'; salva('Richiesta inviata all\'Area Manager');
  }

  document.addEventListener('submit', (ev) => {
    const f = ev.target; const tipo = f.dataset.form; if (!tipo) return;
    ev.preventDefault();
    const v = (n) => (f.elements[n] ? f.elements[n].value.trim() : '');
    const m = f.dataset.id ? trova(S().missioni, f.dataset.id) : null;
    if (tipo === 'richiesta') return richiestaDa(f);
    if (tipo === 'approva-ric') {
      m.target = v('target').split('\n').map((s) => s.trim()).filter(Boolean);
      m.priorita = v('priorita'); m.approvataIl = DB.ora(); m.stato = 'approvata';
      DB.annota(io.id, 'richiesta approvata', { missione: m.id }); chiudiModale(); salva('Approvata: ora il Presidio organizza Scheda e squadra');
    }
    if (tipo === 'proposta') {
      const scelti = [...f.querySelectorAll('[name=t]:checked')].map((x) => x.value);
      const squadra = [...f.querySelectorAll('[name=sq]:checked')].map((x) => x.value);
      if (!scelti.length) { avviso('Scegli almeno un target operativo'); return; }
      if (!squadra.length) { avviso('Organizza la squadra: scegli almeno una persona'); return; }
      const prio = new Set([...f.querySelectorAll('[name=p]:checked')].map((x) => x.value));
      m.targetOperativi = scelti.map((id) => ({ locale: id, priorita: prio.has(id) ? 'prioritario' : 'secondario' }));
      m.presaIl = m.presaIl || DB.ora(); m.propostaIl = DB.ora(); m.noteOperative = v('note'); m.finestra = v('finestra');
      m.dataAccertamento = v('data') + 'T21:00'; m.squadra = squadra; m.briefing = f.elements.briefing.checked; m.schedaPronta = true;
      m.squadraApprovataIl = null; m.schedaApprovataIl = null; m.validataIl = null;
      m.titolo = `Missione ${m.comuni.join(', ')} · ${dataIt(m.dataAccertamento)}`;
      (m.opportunita || []).forEach((oid) => { const o = trova(S().opportunita, oid); const r = o && o.stato === 'da_accertare' && R.cambiaStatoOpportunita(o, 'assegnata', io); if (r && r.ok) Object.assign(o, r.opportunita); });
      m.stato = 'proposta';
      notifica('area', `${io.nome} (Presidio) ha inviato la Scheda e la squadra di «${m.titolo}»: squadra da approvare`, m.id);
      DB.annota(io.id, 'proposta inviata', { missione: m.id }); chiudiModale(); salva('Inviata insieme ad Area Manager e District');
    }
    if (tipo === 'ok-squadra') {
      const squadra = [...f.querySelectorAll('[name=sq]:checked')].map((x) => x.value);
      if (!squadra.length) { avviso('La squadra non può essere vuota'); return; }
      m.squadra = squadra; m.squadraApprovataIl = DB.ora(); m.validataIl = m.squadraApprovataIl;
      const mese = m.dataAccertamento.slice(0, 7);
      S().disponibilita.forEach((r) => { if (m.squadra.includes(r.persona) && r.mese === mese) r.incarichi++; });
      m.stato = R.statoDopoApprovazioni(m); if (m.stato === 'autorizzata') m.autorizzataIl = DB.ora();
      DB.annota(io.id, 'squadra approvata', { missione: m.id }); chiudiModale();
      salva(m.stato === 'autorizzata' ? 'Squadra approvata: missione autorizzata' : 'Squadra approvata: manca l\'approvazione della Scheda da parte del District');
    }
    if (tipo === 'debriefing') {
      m.debriefing = {}; m.target.forEach((tt, i) => (m.debriefing[tt] = v('d' + i)));
      m.debriefingIl = DB.ora(); m.stato = 'chiusa';
      (m.opportunita || []).forEach((oid) => { const o = trova(S().opportunita, oid); if (o && o.stato === 'assegnata') { const r = R.cambiaStatoOpportunita(o, 'missione_eseguita', io); if (r.ok) Object.assign(o, r.opportunita, { esitoRegistrato: true }); } });
      DB.annota(io.id, 'debriefing', { missione: m.id }); chiudiModale(); salva('Missione chiusa: debriefing registrato');
    }
    if (tipo === 'opp') {
      const nome = v('loc'), comune = v('comune');
      const l = S().locali.find((x) => R.normalizza(x.nome) === R.normalizza(nome) && x.comune === comune);
      const d = S().districts.find((x) => x.comuni.includes(comune));
      const o = { id: DB.nuovoId('OPP', S().opportunita), locale: l ? l.id : null, nomeLocale: nome, district: d.id, stato: 'aperta', descrizione: v('descr'), fonte: v('fonte'), rilevataIl: DB.ora().slice(0, 10) };
      S().opportunita.push(o);
      if (f.dataset.seg) { const s = trova(S().segnalazioni, f.dataset.seg); s.stato = 'confermata'; s.opportunita = o.id; }
      chiudiModale(); sezione = 'opportunita'; salva('Opportunità creata: ora la valuta il District Manager');
    }
    if (tipo === 'correggi') {
      const e = m.esiti.find((x) => x.locale === f.dataset.loc);
      const r = R.correggiEsito(Object.assign({ id: m.id + '/' + e.locale }, e, { district: m.district }), 'valore', f.elements.valore.value, io, v('motivo'), DB.ora());
      if (!r.ok) { f.querySelector('[data-errori]').textContent = r.motivo; return; }
      Object.assign(e, { valore: r.esito.valore, corretto: true, storia: r.esito.storia });
      m.iride = m.iride || { S: {} }; if (m.iride.S[e.locale]) m.iride.S[e.locale].e = r.esito.valore;
      S().correzioni.push(Object.assign({}, r.correzione, { missione: m.id, locale: e.locale, district: m.district }));
      chiudiModale(); salva('Esito corretto: avvisati il District Manager e l\'accertatore');
    }
    if (tipo === 'persona') {
      const x = DB.persona(f.dataset.id);
      const nuova = Object.assign({}, x, { funzione: v('funzione') || null, argo: v('argo'), perimetro: v('perimetro') === 'area' ? { tipo: 'area' } : { tipo: 'district', id: v('perimetro') }, accertamenti: f.elements.acc.checked });
      const err = R.validaPersona(nuova).concat(R.validaPersone(S().persone.map((p) => (p.id === x.id ? nuova : p))).filter((e) => !e.includes(' – ')));
      if (err.length) { f.querySelector('[data-errori]').textContent = 'Non salvato: ' + err.join(' · '); return; }
      Object.assign(x, nuova); chiudiModale(); salva('Permessi aggiornati');
    }
  });

  document.addEventListener('input', (ev) => {
    if (ev.target.id === 'cerca-locali') { cercaLocali = ev.target.value; const pos = ev.target.selectionStart; disegna(); const n = document.getElementById('cerca-locali'); n.focus(); n.setSelectionRange(pos, pos); }
  });
  document.addEventListener('change', async (ev) => {
    if (ev.target.dataset && ev.target.dataset.file) {
      const file = ev.target.files[0]; if (!file) return;
      try { const r = await leggiFile(file); caricaElenco(ev.target.dataset.file, r.intestazioni, r.righe, file.name); }
      catch (e) { S().caricamenti.push({ tipo: ev.target.dataset.file, quando: DB.ora(), chi: io.id, file: file.name, esito: 'bloccato', dettaglio: e.message + '. Nulla è stato modificato.' }); salva('File non leggibile'); }
      return;
    }
    if (ev.target.id === 'chi') { DB.personaAttiva('argo', ev.target.value); io = DB.persona(ev.target.value); selMissione = null; disegna(); avviso('Ora sei ' + io.nome); }
    if (ev.target.dataset.censimento) { const o = trova(S().opportunita, ev.target.dataset.censimento); o.censimentoAggiornato = ev.target.checked; DB.salva(); }
  });

  // Sul telefono le tabelle diventano schede: ogni cella porta con sé il nome della sua colonna (argo.css, sotto i 700px).
  function etichetteTabelle() {
    app.querySelectorAll('table.reg:not(.schede)').forEach((tab) => {
      const righe = [...tab.rows];
      const testa = righe[0] && righe[0].querySelector('th') ? righe[0] : null;
      const nomi = testa ? [...testa.cells].map((c) => c.textContent.trim()) : [];
      if (testa) testa.classList.add('intestazione');
      righe.forEach((tr) => { if (tr !== testa && tr.cells.length === nomi.length) [...tr.cells].forEach((td, i) => { if (nomi[i]) td.setAttribute('data-et', nomi[i]); }); });
      tab.classList.add('schede');
    });
  }
  new MutationObserver(etichetteTabelle).observe(app, { childList: true, subtree: true });
  etichetteTabelle();
  // passaggio a IRIDE con la stessa persona, senza rientrare (solo per chi può: regole.js)
  document.addEventListener('click', (ev) => {
    if (!ev.target.closest('[data-passa-iride]') || !R.puoPassareAIride(io).ok) return;
    DB.personaAttiva('iride', io.id);
    location.hash = '#iride';   // avvio.js ricarica la pagina sulla vista scelta
  });
  // telefono: «Altro» apre e chiude il menu; scegliere una sezione lo chiude
  document.addEventListener('click', (ev) => {
    if (ev.target.closest('[data-menu]')) { menuTelefono = !menuTelefono; disegna(); window.scrollTo(0, 0); return; }
    if (ev.target.closest('[data-sez]')) menuTelefono = false;
  });
  // pulsante giorno/notte (tema comune con IRIDE, avvio.js). Attenzione: «data-tema» sta sulla radice della pagina
  // e dice quale tema è attivo; il pulsante ha un nome diverso, altrimenti ogni clic risulterebbe «dentro» il tema.
  document.addEventListener('click', (ev) => { if (ev.target.closest('[data-cambia-tema]')) { window.Tema.cambia(); disegna(); } });
  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-entra],[data-sez],[data-livello],[data-comune],[data-comune-chiudi],[data-vedi-locali],[data-nuova-opp-comune],[data-missione],[data-indietro],[data-nuova-richiesta],[data-approva-ric],[data-proposta],[data-ok-squadra],[data-ok-scheda],[data-rimanda],[data-aggiorna],[data-notifiche-lette],[data-esempio],[data-debriefing],[data-annulla],[data-chiudi],[data-opp],[data-nuova-opp],[data-conferma-seg],[data-archivia-seg],[data-rivisto],[data-correggi],[data-letto],[data-locali],[data-abbina],[data-non-abbina],[data-proponi],[data-approva],[data-carica-disp],[data-conferma-settimana],[data-modifica-persona],[data-ricerca],[data-ripristina]');
    if (!t || t.disabled) return;
    const d = t.dataset;
    if (d.livello) { livelli[d.livello] = !livelli[d.livello]; disegna(); return; }
    if (d.comune) { if (t.classList.contains('fuori')) { avviso('Fuori dal tuo perimetro'); } comuneSel = d.comune; disegna(); return; }
    if ('comuneChiudi' in d) { comuneSel = null; disegna(); return; }
    if (d.vediLocali) { sezione = 'locali'; schedaLocali = 'censimento'; cercaLocali = d.vediLocali; disegna(); window.scrollTo(0, 0); return; }
    if (d.nuovaOppComune) { moduloNuovaOpp(null, d.nuovaOppComune); return; }
    if (d.entra) { DB.personaAttiva('argo', d.entra); io = DB.persona(d.entra); disegna(); return; }
    if (d.sez) { sezione = d.sez; selMissione = null; disegna(); window.scrollTo(0, 0); return; }
    if (d.missione) { ev.preventDefault(); sezione = 'missioni'; selMissione = d.missione; disegna(); window.scrollTo(0, 0); return; }
    if ('indietro' in d) { selMissione = null; disegna(); return; }
    if ('chiudi' in d) { chiudiModale(); return; }
    if ('nuovaRichiesta' in d) { moduloRichiesta(d.nuovaRichiesta, !!d.urgente); return; }
    const m = (id) => trova(S().missioni, id);
    if (d.approvaRic) return moduloApprovaRichiesta(m(d.approvaRic));
    if (d.proposta) return moduloProposta(m(d.proposta));
    if (d.okSquadra) return moduloApprovaSquadra(m(d.okSquadra));
    if (d.okScheda) {
      const x = m(d.okScheda);
      DB.chiedi({ titolo: 'Approvare la Scheda Missione?', testo: 'È l\'ultima analisi del District prima dell\'accertamento. L\'Area Manager riceverà una notifica.', conferma: 'Approva la Scheda' }, () => {
        x.schedaApprovataIl = DB.ora();
        notifica('area', `${io.nome} (${DB.district(x.district).nome}) ha approvato la Scheda di «${x.titolo}»`, x.id);
        x.stato = R.statoDopoApprovazioni(x); if (x.stato === 'autorizzata') x.autorizzataIl = DB.ora();
        salva(x.stato === 'autorizzata' ? 'Scheda approvata: missione autorizzata, notifica all\'Area Manager' : 'Scheda approvata: manca l\'approvazione della squadra. Notifica all\'Area Manager');
      });
      return;
    }
    if (d.rimanda) {
      const x = m(d.rimanda);
      DB.chiedi({ titolo: 'Chiedere una modifica al Presidio?', campo: 'Cosa va cambiato (obbligatorio)', obbligatorio: true, conferma: 'Rimanda al Presidio' }, (motivo) => {
        x.stato = 'in_preparazione'; x.modifiche = (x.modifiche || 0) + 1; x.noteModifica = motivo; x.squadraApprovataIl = null; x.schedaApprovataIl = null; x.validataIl = null;
        if (io.funzione !== 'area') notifica('area', `${io.nome} ha chiesto una modifica a «${x.titolo}»: ${motivo}`, x.id);
        salva('Rimandata al Presidio');
      });
      return;
    }
    if ('notificheLette' in d) { notificheNonLette().forEach((n) => n.lette.push(io.id)); salva('Notifiche segnate come lette'); return; }
    if (d.esempio) {
      const es = S().esempi[d.esempio];
      caricaElenco(d.esempio === 'sbagliato' ? 'licenze' : d.esempio, es.intestazioni, es.righe, es.nome + '.xlsx (esempio)');
      return;
    }
    if (d.debriefing) return moduloDebriefing(m(d.debriefing));
    if (d.aggiorna) { const x = m(d.aggiorna); x.aggiornatiIl = DB.ora(); salva('Target aggiornati: il conteggio dell\'anticipo non cambia'); return; }
    if (d.annulla) {
      const x = m(d.annulla);
      DB.chiedi({ titolo: 'Annullare la missione?', testo: 'Le opportunità collegate torneranno «da accertare».', campo: 'Motivo dell\'annullamento (obbligatorio)', obbligatorio: true, conferma: 'Annulla la missione' }, (motivo) => {
        x.stato = 'annullata'; x.motivoAnnullamento = motivo;
        (x.opportunita || []).forEach((oid) => { const o = trova(S().opportunita, oid); if (o && o.stato === 'assegnata') { const r = R.cambiaStatoOpportunita(o, 'da_accertare', io); if (r.ok) Object.assign(o, r.opportunita); } });
        salva('Missione annullata: le opportunità tornano «da accertare»');
      });
      return;
    }
    if (d.opp) {
      const o = trova(S().opportunita, d.opp);
      const esegui = (extra) => { const r = R.cambiaStatoOpportunita(o, d.stato, io, extra || {}); if (!r.ok) { avviso(r.motivo); return; } Object.assign(o, r.opportunita); salva('Opportunità: ' + STATO_OPP[d.stato][0]); };
      if (d.stato === 'scartata') DB.chiedi({ titolo: 'Scartare l\'opportunità?', campo: 'Perché la scarti? (obbligatorio)', obbligatorio: true, conferma: 'Scarta' }, (mot) => esegui({ motivo: mot }));
      else esegui();
      return;
    }
    if ('nuovaOpp' in d) { moduloNuovaOpp(null); return; }
    if (d.confermaSeg) { moduloNuovaOpp(trova(S().segnalazioni, d.confermaSeg)); return; }
    if (d.archiviaSeg) { trova(S().segnalazioni, d.archiviaSeg).stato = 'archiviata'; salva('Segnalazione archiviata'); return; }
    if (d.rivisto) { const [mid, loc] = d.rivisto.split('|'); m(mid).esiti.find((e) => e.locale === loc).rivisto = true; salva('Esito rivisto'); return; }
    if (d.correggi) { const [mid, loc] = d.correggi.split('|'); moduloCorreggi(mid, loc); return; }
    if ('letto' in d) { S().correzioniLette = S().correzioniLette || {}; S().correzioniLette[io.id] = (S().correzioniLette[io.id] || []).concat(correzioniNonLette().map((c) => c.esito + c.quando)); salva('Correzioni segnate come lette'); return; }
    if (d.locali) { schedaLocali = d.locali; disegna(); return; }
    if (d.abbina) { const l = trova(S().licenze.concat(S().mda), d.abbina); const id = l.abbinamento.candidati[0]; S().memoriaAbbinamenti[l.abbinamento.chiave] = id; l.locale = id; l.confermato = true; l.abbinamento = { stato: 'confermato', locale: id }; salva('Abbinamento confermato e ricordato'); return; }
    if (d.nonAbbina) { const l = trova(S().licenze.concat(S().mda), d.nonAbbina); l.abbinamento = { stato: 'non_abbinato' }; salva('Riga lasciata senza abbinamento'); return; }
    if (d.proponi) { S().localiNuoviCampo.find((x) => x.k === d.proponi).stato = 'proposto'; salva('Proposto al District Manager'); return; }
    if (d.approva) {
      const x = S().localiNuoviCampo.find((y) => y.k === d.approva); x.stato = 'approvato';
      const id = 'VC-' + String(Math.max(...S().locali.map((l) => +l.id.slice(3))) + 1).padStart(5, '0');
      S().locali.push({ id, nome: x.nome, comune: x.comune, quartiere: x.quartiere, indirizzo: x.indirizzo, categoria: x.categoria, statoAttivita: 'Da verificare', fonte: 'Trovato sul campo', stato: 'da verificare', district: x.district });
      salva('Entrato nel Censimento con codice ' + id); return;
    }
    if ('caricaDisp' in d) { S().disponibilita.forEach((r) => (r.fonte = 'file mensile')); salva('File mensile delle disponibilità caricato (simulato)'); return; }
    if ('confermaSettimana' in d) { S().confermeSettimana = S().confermeSettimana || []; S().confermeSettimana.push({ settimana: settimanaCorrente(), chi: io.id, quando: DB.ora() }); salva('Programmazione della settimana confermata'); return; }
    if (d.modificaPersona) { moduloPersona(d.modificaPersona); return; }
    if (d.ricerca) {
      const l = DB.locale(d.ricerca); const box = document.querySelector('[data-ricerche]');
      if (box) box.innerHTML = `<div class="ricerche"><b>Ricerche pronte per ${esc(l.nome)}</b> (simulate: nella demo non vengono aperte)${ricercheWeb(l).map((q) => `<div>🔎 ${esc(q)}</div>`).join('')}<small class="perche">Un risultato web è una pista, non una prova.</small></div>`;
      return;
    }
    if ('ripristina' in d) { DB.chiedi({ titolo: 'Ripristinare i dati della demo?', testo: 'Le prove fatte in questo browser andranno perse.', conferma: 'Ripristina' }, () => { DB.ripristina(); location.reload(); }); }
  });

  // suggerimento sopra la mappa (si aggiorna senza ridisegnare la pagina)
  document.addEventListener('mousemove', (ev) => {
    const tip = document.getElementById('suggerimento'); if (!tip) return;
    const cella = ev.target.closest && ev.target.closest('[data-comune]');
    if (!cella) { tip.className = 'suggerimento'; return; }
    const x = datiComuni()[cella.dataset.comune], box = tip.parentElement.getBoundingClientRect();
    const dentro = vede(x.district.id);
    tip.innerHTML = `<b>${esc(x.comune)}</b><small class="perche" style="display:block">${esc(x.district.nome)}</small>` + (dentro
      ? `<dl><dt>Locali censiti</dt><dd>${x.locali}</dd><dt>Licenze</dt><dd>${x.licenze}</dd><dt>Licenze per locale</dt><dd>${(x.rapporto * 100).toFixed(0)}%</dd><dt>Opportunità</dt><dd>${x.opp.length}</dd><dt>Missioni</dt><dd>${x.missioni.length}</dd></dl>`
      : '<p class="perche">Fuori dal tuo perimetro</p>');
    let l = ev.clientX - box.left + 14, tp = ev.clientY - box.top + 14;
    if (l + 220 > box.width) l = ev.clientX - box.left - 230;
    tip.style.left = l + 'px'; tip.style.top = tp + 'px'; tip.className = 'suggerimento on';
  });

  // aggiornamenti da IRIDE in un'altra scheda (esiti, segnalazioni)
  DB.su((st, esterno) => { if (esterno && !document.querySelector('.modale')) { disegna(); avviso('Aggiornato da IRIDE'); } });

  disegna();
};
</script>
<script>/* avvio.js */
/*
 * Avvio della demo: sceglie la vista dall'indirizzo (#argo | #iride; nel file anche ?vista=)
 * e attiva solo lo stile di quella vista (gli stili di ARGO e IRIDE non si mescolano).
 * Senza parametro mostra la pagina iniziale.
 */
(function () {
  'use strict';
  // Vista dal # (#argo, #iride): le pagine pubblicate su claude.ai passano solo il #. Nel file vale anche ?vista=.
  var vista = (location.hash || '').replace('#', '') || new URLSearchParams(location.search).get('vista') || '';
  window.addEventListener('hashchange', function () { location.reload(); });
  function attivaStile(id) { var s = document.getElementById(id); if (s) s.media = 'all'; }

  // Tema notte/giorno, comune ad ARGO e IRIDE (tema.css). La scelta resta in questo browser, se può.
  window.Tema = (function () {
    var CHIAVE = 'argo-iride-tema';
    function letto() { try { return localStorage.getItem(CHIAVE) === 'giorno' ? 'giorno' : 'notte'; } catch (e) { return 'notte'; } }
    function applica(t) { document.documentElement.setAttribute('data-tema', t); }
    applica(letto());
    return {
      attuale: function () { return document.documentElement.getAttribute('data-tema') === 'giorno' ? 'giorno' : 'notte'; },
      cambia: function () {
        var t = this.attuale() === 'giorno' ? 'notte' : 'giorno';
        applica(t);
        try { localStorage.setItem(CHIAVE, t); } catch (e) { /* senza memoria vale solo per questa sessione */ }
        return t;
      }
    };
  })();

  function link(v) { return '#' + v; }

  function paginaIniziale() {
    attivaStile('css-inizio');
    document.title = 'ARGO e IRIDE';
    var DB = window.Dati; DB.carica();
    document.getElementById('app').innerHTML =
      '<div class="radar-sfondo" aria-hidden="true"></div><i class="punto" style="right:22vmin;top:34%" aria-hidden="true"></i><i class="punto" style="right:40vmin;top:62%;animation-delay:1.2s" aria-hidden="true"></i><i class="punto" style="right:12vmin;top:70%;animation-delay:2.1s" aria-hidden="true"></i>' +
      '<main class="inizio">' +
      '<p class="avviso">Demo: dati inventati, funzioni simulate</p>' +
      '<h1>ARGO <span>·</span> IRIDE</h1>' +
      '<p class="claim">Cento occhi sul territorio: programmare per tempo gli accertamenti e tracciarne gli esiti.</p>' +
      '<div class="scelte">' +
      '<a class="scelta argo" href="' + link('argo') + '"><b>ARGO</b><span>La sala operativa, sul PC: richieste, missioni, opportunità, indicatori.</span></a>' +
      '<a class="scelta iride" href="' + link('iride') + '"><b>IRIDE</b><span>L\'app sul telefono: missioni, esiti e segnalazioni, anche senza rete.</span></a>' +
      '<a class="scelta iride" href="' + link('mda') + '"><b>MDA IN CAMPO</b><span>IRIDE per le schede MDA: carichi il master, itinerari, posizione, tratte Maps, esiti ed Excel.</span></a>' +
      '</div>' +
      '<p class="nota">Nel file scaricato puoi aprire ARGO e IRIDE in due schede: si aggiornano a vicenda. ' +
      (DB.memoriaDisponibile ? 'Le tue prove restano in questo browser.' : 'Questo browser non conserva i dati: alla chiusura la demo riparte da capo.') +
      ' <button id="ripristina">Ripristina dati demo</button></p>' +
      '</main>';
    document.getElementById('ripristina').addEventListener('click', function () {
      DB.chiedi({ titolo: 'Ripristinare i dati della demo?', testo: 'Le prove fatte in questo browser andranno perse.', conferma: 'Ripristina' }, function () { DB.ripristina(); location.reload(); });
    });
  }

  if (vista === 'iride' && window.avviaIride) { attivaStile('css-iride'); window.avviaIride(); }
  else if (vista === 'mda' && window.avviaMda) { attivaStile('css-iride'); window.avviaMda(); }   // IRIDE · MDA in campo
  else if (vista === 'argo' && window.avviaArgo) { attivaStile('css-argo'); window.avviaArgo(); }
  else paginaIniziale();
})();
</script>
</body>
</html>
